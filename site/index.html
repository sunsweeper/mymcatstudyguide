<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MCAT flashcards with spaced repetition.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>MyMCATstudyguide.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Dancing+Script:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one calm study card on a blush desk. Rose is reserved for actions and progress; everything else stays neutral. */
:root{
  --bg:#fbf2f5;        /* blush-tinted paper */
  --surface:#fffafc;   /* card */
  --ink:#352a2e;       /* plum-gray text, softer than black */
  --muted:#7d6a71;
  --line:#f1dfe6;
  --accent:#c84f7d;    /* dusty rose: buttons, progress */
  --accent-ink:#ffffff;
  --accent-soft:#fce6ee; /* selected and hover fills */
  --primary:#f7c3d6; --primary-edge:#eda5c0; --primary-ink:#2a1f24; /* main buttons: light rose, dark text */
  --margin:#f3c2d4;    /* index-card margin rule */
  --quote:#fdf0f5;
  --shadow:0 1px 2px rgba(80,40,55,.05), 0 8px 24px -12px rgba(80,40,55,.12);
  --f-card:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-script:"Dancing Script", "Segoe Script", "Brush Script MT", cursive;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:12px;
}
/* Page background: white or black (her choice, top right). Cards keep the same colors either way. */
:root{--page:#ffffff;--on-page:var(--ink);color-scheme:light}
:root[data-bg="dark"]{--page:#000000;--on-page:#ffffff}

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:620px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-ui);font-weight:700;font-size:.95rem;margin:0;color:var(--ink)}
.count{font-family:var(--f-ui);font-weight:700;font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums}

button{-webkit-tap-highlight-color:transparent}
.btn:focus-visible,.card:focus-visible,.topic:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:0;border-radius:4px;transition:width .35s ease}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  min-height:320px;padding:22px 24px 20px 48px;cursor:pointer;display:flex;flex-direction:column;gap:16px;
  transition:border-color .2s}
.card:hover{border-color:var(--margin)}
.card::before{content:"";position:absolute;top:14px;bottom:14px;left:30px;width:1.5px;border-radius:2px;background:var(--margin)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--f-ui);font-size:.95rem;color:var(--ink)}
.meta .side{font-weight:700;flex-shrink:0}
.face{font-family:var(--f-card);font-size:1.32rem;line-height:1.55;flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0;overflow-wrap:anywhere}
.face .asked{font-family:var(--f-ui);font-size:.88rem;line-height:1.45;color:var(--muted)}
.face .ans{font-size:1.12rem;line-height:1.65}
.face sub,.face sup{line-height:0}
.hint{font-size:.95rem;color:var(--ink);text-align:center;min-height:1.2em}
@keyframes fade{from{opacity:.35}to{opacity:1}}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{font:700 1rem var(--f-ui);padding:14px 12px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--margin);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary-edge)}
.btn.primary:hover{filter:brightness(1.04);background:var(--primary)}
.btn[hidden]{display:none}
.link{font:700 .88rem var(--f-ui);background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 0;
  text-decoration:underline;text-decoration-color:var(--margin);text-underline-offset:4px}
.link:hover{color:var(--accent)}

.screen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:32px 26px;display:flex;flex-direction:column;gap:22px;min-height:320px;justify-content:center}
.screen.quote{background:var(--quote)}
.welcome{font-family:var(--f-script);font-weight:600;font-size:1.9rem;line-height:1.2;margin:0;color:var(--ink)}
.lede{font-size:.95rem;color:var(--ink);margin:-10px 0 0;line-height:1.5}
.big{font-family:var(--f-card);font-size:1.5rem;line-height:1.4;margin:0;text-wrap:balance}
.q-text{font-family:var(--f-card);font-size:1.4rem;line-height:1.5;font-style:italic;text-wrap:pretty}
.q-by{font-family:var(--f-ui);font-size:.95rem;color:var(--ink);margin-top:12px}
.q-by::before{content:"";display:inline-block;width:18px;height:1.5px;background:var(--accent);vertical-align:middle;margin-right:8px}

.topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px 16px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--f-ui);min-width:0;
  transition:background .15s,border-color .15s}
.topic:hover{border-color:var(--accent);background:var(--accent-soft)}
.topic .t-name{font-weight:700;font-size:1.12rem}
.topic .t-full{font-size:.95rem;color:var(--ink);line-height:1.4}
.topic .t-n{font-family:var(--f-ui);font-weight:700;font-size:.95rem;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
.topic .t-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.topic .t-head .t-n{margin-top:0;flex-shrink:0}
.topic .t-full{margin-bottom:12px}
.topic .t-score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:12px;width:100%;border-top:1.5px solid var(--margin)}
.topic .sc{display:flex;flex-direction:column;gap:1px;min-width:0}
.topic .sc .v{font-family:var(--f-card);font-size:1.4rem;line-height:1.1;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.topic .sc .l{font-size:.85rem;color:var(--ink);line-height:1.2}
.topic .sc.lead .v,.topic .sc.lead .l{font-weight:700}
.topic.wide{grid-column:1 / -1}
.topic.all{grid-column:1 / -1;background:var(--accent-soft);border-color:var(--margin)}
.screen .btn{min-width:150px}
.screen > .btn{align-self:flex-start}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand .welcome[hidden]{display:none}
.site{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;margin-left:auto}
header{align-items:center}
.crumb{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:.95rem;color:var(--ink)}
.crumb[hidden]{display:none}
#study > div{display:flex;flex-direction:column;gap:18px}
@media (max-width:420px){.topics{grid-template-columns:1fr}.card{padding-left:42px}.card::before{left:26px}.welcome{font-size:1.75rem}.pick{font-size:1.3rem}}

.controls.one{grid-template-columns:1fr}
.controls.three{grid-template-columns:repeat(3,1fr)}
.controls.prevrow{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr)}
#prev{white-space:nowrap}
.controls[hidden]{display:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--primary);filter:none}
.btn:not(.primary):disabled:hover{background:var(--surface);border-color:var(--line)}
.write{display:flex;flex-direction:column;gap:8px}
.write[hidden]{display:none}
.write label{font-size:.95rem;font-weight:700;color:var(--ink)}
.write textarea{font:1.05rem/1.55 var(--f-card);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;width:100%;box-sizing:border-box;resize:vertical;min-height:96px}
.write textarea:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--margin)}
.lab{display:block;font-family:var(--f-ui);font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:4px}
.yours{font-family:var(--f-card);font-size:1.02rem;line-height:1.6;background:var(--bg);border-radius:8px;padding:10px 12px;border-left:3px solid var(--margin)}
.daily{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sec-title{font-family:var(--f-card);font-weight:700;font-size:2rem;line-height:1.2;color:var(--ink);text-align:center;margin:0}
.totals{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px;font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums}
.pick{font-family:var(--f-card);font-weight:600;font-size:1.45rem;line-height:1.3;color:var(--ink);margin:0;text-wrap:balance}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.s-n{font-family:var(--f-card);font-weight:600;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.s-l{font-size:.95rem;color:var(--ink)}
#studyAll{align-self:stretch}
@media (max-width:420px){.controls.prevrow{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}#prev{font-size:.9rem;padding-left:8px;padding-right:8px}.controls.three .btn{padding:12px 6px;font-size:.9rem}.stat{padding:12px 10px}.s-n{font-size:1.6rem}.s-l{font-size:.85rem}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.seg button{font:700 .95rem var(--f-ui);color:var(--ink);background:transparent;border:0;border-radius:9px;padding:10px 6px;cursor:pointer;transition:background .15s}
.seg button:hover{background:var(--accent-soft)}
.seg button[aria-checked="true"]{background:var(--primary);box-shadow:inset 0 0 0 1px var(--primary-edge)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.seg button{font-size:.85rem;padding:9px 4px}}
.notice{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.95rem;font-weight:700}
.notice[hidden]{display:none}
.backup{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center}
.backup-msg{margin:0;min-height:1.2em;text-align:center;font-size:.95rem;color:var(--ink)}
.backup-msg:empty{display:none}
.explain{display:flex;flex-direction:column;gap:10px}
.explain[hidden],.explain-panel[hidden]{display:none}
.explain-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.ex-sec{display:flex;flex-direction:column;gap:2px}
.ex-sec p{margin:0;font-family:var(--f-card);font-size:1.02rem;line-height:1.6;color:var(--ink)}
.ex-none{margin:0;font-size:.95rem;color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:6px}
.notes-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.notes-foot .link[hidden]{display:none}
.notes label{font-size:.95rem;font-weight:700;color:var(--ink)}
.notes textarea{font:1rem/1.55 var(--f-card);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;box-sizing:border-box;resize:vertical;min-height:80px}
.notes textarea:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--margin)}
.notes-status{font-size:.85rem;color:var(--ink);min-height:1em}
.testdate{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.testdate input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.testdate input:focus{outline:2px solid var(--accent);outline-offset:2px}
.pace{max-width:36ch}
.site .link{font-size:.95rem}
.meta{flex-wrap:wrap}
.meta-r{display:inline-flex;align-items:baseline;gap:12px;flex-shrink:0;margin-left:auto}
.bm{font:700 .95rem var(--f-ui);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;text-transform:none;letter-spacing:0}
.bm[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--margin)}
.bm:hover{border-color:var(--accent)}
.bm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wide-btn{width:100%}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bm-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px 14px}
.bm-row details{flex:1;min-width:0}
.bm-row summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
.bm-row summary::-webkit-details-marker{display:none}
.bm-id{font-size:.85rem;color:var(--ink)}
.bm-q{font-family:var(--f-card);font-size:1.05rem;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.bm-a{font-family:var(--f-card);font-size:1rem;line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.bm-hint{font-size:.85rem;color:var(--ink);font-weight:400}
.wk-sec{display:flex;flex-direction:column;gap:8px}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid var(--margin);padding-bottom:6px}
.wk-head .t-name{font-weight:700;font-size:1.12rem}
.wk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;font-size:.95rem;color:var(--ink)}
.wk-row.is-weak .wk-name,.wk-row.is-weak .wk-val{font-weight:700}
.wk-val{font-variant-numeric:tabular-nums;text-align:right}
.wk-bar{grid-column:1 / -1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.wk-bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.report-row{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;margin-top:-8px}
.report-row .link{font-size:.85rem;font-weight:400}
.report-flash{font-size:.85rem;font-weight:700;color:var(--ink)}
.report-box{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.report-box[hidden]{display:none}
.report-box label{font-size:.95rem;font-weight:700;color:var(--ink)}
.report-box textarea{font:1rem/1.5 var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;box-sizing:border-box;resize:vertical}
.report-box textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.report-msg{font-size:.85rem;color:var(--ink)}
.report-msg:empty{display:none}
.controls.three .btn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.reinforce-foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.char-hint{font-size:.85rem;color:var(--ink)}
.reinforce-foot .btn{min-width:140px}
.write[hidden]{display:none}
.skip-row{display:flex;justify-content:center;margin-top:4px}
.toggle{display:inline-flex;align-items:center;gap:10px;font:700 .95rem var(--f-ui);color:var(--ink);background:none;border:0;padding:6px 4px;cursor:pointer}
.toggle .switch{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line);transition:background .15s;flex-shrink:0}
.toggle .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.toggle[aria-pressed="true"] .switch{background:var(--accent)}
.toggle[aria-pressed="true"] .switch::after{transform:translateX(16px)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.controls.two{grid-template-columns:1fr 1fr}
.link-btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.note-row{flex-direction:column;align-items:stretch}
.note-text{font-family:var(--f-card);font-size:1rem;line-height:1.55;color:var(--ink);border-left:3px solid var(--margin);padding:6px 0 6px 10px;overflow-wrap:anywhere}
/* Header: "Welcome Sarah." fills the same height as the site name + links on the right. */
header{flex-wrap:nowrap}
/* Right-hand header block has a fixed height: 3 text lines (.95rem x 1.5) + 4px padding on each of the 2 links + the 28px button + 3 x 4px gaps. */
:root{--hdr-h:calc(.95rem * 1.5 * 3 + 16px + 28px + 12px)}
.site > h1, .site > .link{line-height:1.5}
.site .mode{height:28px}
.count:empty{display:none}
.brand .welcome{font-size:4.1rem;line-height:var(--hdr-h);white-space:nowrap}
#topicname{font-family:var(--f-card);font-weight:700;font-size:1.5rem;line-height:1.2;color:var(--ink)}
.crumb .link{font-size:.95rem}
@media (max-width:560px){
  .brand .welcome{font-size:min(2.6rem, 10.5vw);line-height:calc(var(--hdr-h) / 2);white-space:normal}
  .brand .welcome .nm{display:block}
}
.title-row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mode{font:400 1rem/1 var(--f-ui);width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Text that sits directly on the page background follows it: dark on white, white on black. */
header, header .link, #title, .welcome, .count, #topicname, .crumb,
#study .hint, .report-row .link, .report-flash, .skip-row .toggle, #write > label, #reinforce > label, .char-hint{color:var(--on-page)}
.counters{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap}
.totals-left{align-items:flex-start;text-align:left}
@media (max-width:520px){.counters{flex-direction:column;align-items:stretch}.counters .totals:not(.totals-left){align-items:flex-end}}
.q-intro{font-family:var(--f-card);font-weight:600;font-size:1.3rem;line-height:1.4;color:var(--ink);text-align:center;margin:0;text-wrap:balance}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="notice" id="saveErr" role="alert" hidden>Your study progress could not be saved. Please check your browser storage settings.</div>
  <header>
    <div class="brand">
      <p class="welcome" id="hello">Welcome <span class="nm">Sarah.</span></p>
      <div class="crumb" id="crumb" hidden>
        <span id="topicname"></span>
        <button class="link" id="change" type="button">Change Topic</button>
      </div>
    </div>
    <div class="site">
      <h1 id="title">MyMCATstudyguide.com</h1>
      <button class="link" id="bmNav" type="button">Bookmarks</button>
      <button class="link" id="notesNav" type="button">My Card Notes</button>
      <button class="mode" id="modeBtn" type="button" aria-pressed="false" aria-label="Dark background" title="Dark background">☾</button>
      <div class="count" id="count"></div>
    </div>
  </header>

  <section class="screen" id="screen"></section>

  <div id="study" hidden>
    <div>
      <div class="seg" id="view" role="radiogroup" aria-label="Card display">
        <button type="button" role="radio" data-v="q">Questions First</button>
        <button type="button" role="radio" data-v="a">Answers First</button>
        <button type="button" role="radio" data-v="mix">Random Mix</button>
      </div>

["ps", "What is signal detection criterion?", "Decision threshold that determines willingness to report detecting a signal.", "6A-016"],
["ps", "What is d′ in signal detection theory?", "A sensitivity measure separating signal and noise distributions.", "6A-017"],
["ps", "How do rods differ from cones in dim light?", "Rods are more light-sensitive and support low-light vision without color discrimination.", "6A-018"],
["ps", "Where is cone density highest in the human retina?", "The fovea.", "6A-019"],
["ps", "What is the optic disc?", "The site where optic nerve fibers exit the retina, producing a blind spot.", "6A-020"],
["ps", "What does the opponent-process theory of color perception propose?", "Color channels encode opposing signals such as red–green and blue–yellow.", "6A-021"],
["ps", "What is perceptual constancy?", "Perceiving stable object properties despite changes in sensory input.", "6A-022"],
["ps", "What is the Gestalt principle of closure?", "Perceiving incomplete contours as continuous or complete shapes.", "6A-023"],
["ps", "What is binocular disparity used for?", "Estimating depth from differences between the two eyes' images.", "6A-024"],
["ps", "What is accommodation in the eye?", "Changing lens curvature to focus objects at different distances.", "6A-025"],
["ps", "What distinguishes myopia from hyperopia?", "Myopia focuses distant images in front of the retina; hyperopia tends to focus near images behind it without accommodation.", "6A-026"],
["ps", "Which part of the ear contains the organ of Corti?", "Cochlea.", "6A-027"],
["ps", "Why is olfaction unusual among senses?", "Primary olfactory signaling can reach cortex without an initial thalamic relay.", "6A-028"],
["ps", "What is the difference between absolute threshold and difference threshold?", "Minimum detectable stimulus versus minimum detectable change.", "6A-029"],
["ps", "What is encoding specificity?", "Retrieval improves when cues match conditions present during encoding.", "6B-030"],
["ps", "What is state-dependent memory?", "Recall can improve when internal conditions at retrieval resemble those at encoding.", "6B-031"],
["ps", "What is context-dependent memory?", "Recall may improve when environmental context matches encoding context.", "6B-032"],
["ps", "What is prospective memory?", "Remembering to perform a future intended action.", "6B-033"],
["ps", "What is the phonological loop in working-memory models?", "A system for temporarily maintaining and rehearsing verbal information.", "6B-034"],
["ps", "What does the visuospatial sketchpad maintain?", "Temporary visual and spatial information.", "6B-035"],
["ps", "What is chunking in memory?", "Grouping information into meaningful units to improve recall.", "6B-036"],
["ps", "What is the spacing effect?", "Long-term learning often improves when practice is distributed over time.", "6B-037"],
["ps", "What is the testing effect?", "Retrieving information from memory can improve later retention.", "6B-038"],
["ps", "What is a retrieval cue?", "Information that helps access a stored memory.", "6B-039"],
["ps", "What is source-monitoring error?", "Misremembering where or how a piece of information was acquired.", "6B-040"],
["ps", "What is a heuristic?", "A simplifying mental shortcut that can be efficient but sometimes inaccurate.", "6B-041"],
["ps", "What is the diathesis–stress model?", "Disorder risk arises from interaction between predisposition and stressors.", "7A-034"],
["ps", "How does generalized anxiety disorder differ from a specific phobia?", "GAD involves broad persistent worry; a specific phobia centers on a particular object or situation.", "7A-035"],
["ps", "What is the defining feature of a manic episode?", "Sustained elevated, expansive, or irritable mood with increased energy and associated symptoms.", "7A-036"],
["ps", "What distinguishes a delusion from a hallucination?", "A delusion is a fixed false belief; a hallucination is perception without an external stimulus.", "7A-037"],
["ps", "What is anhedonia?", "Reduced ability to experience pleasure or interest.", "7A-038"],
["ps", "What is the Yerkes–Dodson law's general claim?", "Performance often relates nonlinearly to arousal, with optimal arousal depending on task difficulty.", "7A-039"],
["ps", "What does learned helplessness describe?", "Reduced attempts to escape or change conditions after experiencing uncontrollable adversity.", "7A-040"],
["ps", "What is diffusion of responsibility?", "Feeling less personally obligated to act when others are present.", "7B-012"],
["ps", "What is implicit bias?", "Automatically activated associations that can influence perception and behavior.", "8B-016"],
["ps", "What is a social institution?", "An enduring organized pattern of roles and norms meeting social needs.", "9A-016"],
["ps", "What is social stratification?", "Hierarchical division of people into layers based on resources, power, or status.", "10A-016"],
["ps", "What is a cultural norm?", "A shared expectation about appropriate behavior.", "9A-017"],
["ps", "What are mores?", "A norm carrying strong moral significance and stronger sanctions.", "9A-018"],
["ps", "What is cultural diffusion?", "Spread of cultural practices or ideas between groups.", "9A-019"],
["ps", "What is a population pyramid?", "A graph showing the age and sex composition of a population.", "9B-016"],
["ps", "What does a high dependency ratio suggest?", "Many people outside typical working ages relative to the working-age population.", "9B-017"],
["ps", "What is total fertility rate?", "Average number of births a woman would have if current age-specific fertility rates persisted.", "9B-018"],
["ps", "What characterizes the second stage of demographic transition?", "Falling death rates with birth rates remaining high, producing rapid growth.", "9B-019"],
["ps", "What characterizes the fourth stage of demographic transition?", "Low birth and death rates, often with slow population growth.", "9B-020"],
["ps", "What is population momentum?", "Continued growth from a youthful age structure even after fertility rates fall.", "9B-021"],
["ps", "What is net migration?", "Immigration minus emigration over a given period.", "9B-022"],
["ps", "What is epidemiological transition?", "Shifts in the dominant causes of death and illness as populations change.", "9B-023"],
["ps", "What is the difference between incidence and prevalence?", "Incidence counts new cases over time; prevalence counts existing cases at a point or period.", "9B-024"],
["ps", "How can increasing disease duration affect prevalence?", "It can raise prevalence even if incidence does not increase.", "9B-025"],
["ps", "What is a cohort study?", "A study following groups distinguished by exposure to compare later outcomes.", "9B-026"],
["ps", "What is a cross-sectional study?", "A study assessing exposures and outcomes at roughly the same time.", "9B-027"],
["ps", "What is an ecological fallacy?", "Incorrectly inferring individual-level relationships from group-level statistics.", "9B-028"],
["ps", "What is relative risk in an exposure study?", "Risk in the exposed group divided by risk in the unexposed group.", "9B-029"],
["ps", "What does a relative risk of 1 indicate?", "The risk is the same in both groups, so no association between exposure and outcome was observed.", "9B-030"],
["bb","How is a bacterial genome organized?","Bacteria typically have a circular chromosome in the nucleoid, often alongside plasmids; some species have multiple or linear chromosomes.","2B-005"],
["bb","Plasmids?","Small circular DNA separate from the chromosome. Can carry antibiotic resistance; the F plasmid enables conjugation.","2B-006"],
["bb","How do prokaryotes divide?","Binary fission: the chromosome copies and the cell splits in two. No mitosis.","2B-007"],
["bb","Bacterial growth curve phases?","Lag, exponential (log), stationary, death.","2B-008"],
["bb","Obligate aerobe vs. obligate anaerobe vs. facultative anaerobe?","Obligate aerobe needs O<sub>2</sub>. Obligate anaerobe is harmed by it. Facultative anaerobe uses O<sub>2</sub> when present but can do without.","2B-009"],
["bb","Endospores?","Dormant, highly resistant structures some bacteria form under stress, like Bacillus and Clostridium.","2B-010"],
["bb","Prokaryotic vs. eukaryotic flagella?","Prokaryotic: made of flagellin, spins like a rotor driven by a proton gradient. Eukaryotic: microtubules in a 9+2 array, whips back and forth.","2B-011"],
["bb","Positive-sense vs. negative-sense RNA viruses?","Positive-sense RNA works directly as mRNA. Negative-sense must first be copied by an RNA-dependent RNA polymerase the virus carries.","2B-012"],
["bb","Basic structure of a virus?","Nucleic acid (DNA or RNA) inside a protein capsid. Enveloped viruses also have a lipid coat taken from the host membrane.","2B-013"],
["bb","Parts of a bacteriophage?","Head (capsid holding the genome), tail sheath, and tail fibers. It injects its genome into the bacterium.","2B-014"],
["bb","Prions vs. viroids?","Prions: misfolded proteins that cause normal proteins to misfold. Viroids: small circular RNAs that infect plants.","2B-015"],
["bb","Mitosis vs. meiosis outcome?","Mitosis: 2 identical diploid cells. Meiosis: 4 genetically distinct haploid cells.","2C-009"],
["bb","Cyclins and CDKs?","Cyclins bind and activate cyclin-dependent kinases, which push the cell through cycle checkpoints.","2C-010"],
["bb","Apoptosis?","Programmed cell death carried out by caspases. The cell shrinks and blebs without causing inflammation.","2C-011"],
["bb","Cleavage, morula, blastula?","Cleavage: the zygote divides without growing. Morula: solid ball of cells. Blastula (blastocyst in mammals): hollow ball.","2C-012"],
["bb","Gastrulation?","Forms the three germ layers. In deuterostomes like humans, the blastopore becomes the anus.","2C-013"],
["bb","Neurulation?","The notochord signals ectoderm to fold into the neural tube. Neural crest cells break off and migrate.","2C-014"],
["bb","Totipotent vs. pluripotent vs. multipotent?","Totipotent: any cell, including placenta. Pluripotent: any cell of the body. Multipotent: a limited set of related cells.","2C-015"],
["cp","Gauge vs. absolute pressure?","Gauge excludes atmospheric pressure. Absolute = gauge + atmospheric.","4B-009"],
["cp","Fraction of a floating object below the surface?","ρ<sub>object</sub> ÷ ρ<sub>fluid</sub>.","4B-010"],
["cp","Venturi effect?","Where a pipe narrows, flow speeds up and pressure drops.","4B-011"],
["cp","Viscosity?","A fluid's resistance to flow. Higher viscosity means slower flow and more resistance.","4B-012"],
["cp","Laminar vs. turbulent flow?","Laminar: smooth, parallel layers. Turbulent: chaotic, above a critical speed set by the Reynolds number.","4B-013"],
["cp","Dalton's law of partial pressures?","Total pressure = sum of partial pressures. Each gas: P<sub>i</sub> = X<sub>i</sub>·P<sub>total</sub>.","4B-014"],
["cp","Boyle's law vs. Charles's law?","Boyle: P₁V₁ = P₂V₂ at constant temperature. Charles: V/T is constant at constant pressure (T in kelvin).","4B-015"],
["cp","When is vacuum distillation used?","For compounds with very high boiling points or that decompose when heated. Lower pressure lowers the boiling point.","5C-005"],
["cp","Recrystallization?","Dissolve the solid in a minimum of hot solvent, then cool. Pure crystals form while impurities stay dissolved.","5C-006"],
["cp","Gravity vs. vacuum filtration?","Gravity: used when you want the liquid (filtrate), as in hot filtration. Vacuum: faster, used when you want the solid.","5C-007"],
["cp","Centrifugation?","Spins samples to separate by density and size. Denser material collects in the pellet.","5C-008"],
["cp","Column chromatography on silica: which elutes first?","The less polar compound. Polar compounds stick to the polar silica longer.","5C-009"],
["cp","Gas chromatography?","Vaporized compounds carried by an inert gas through a column, separated by boiling point and polarity.","5C-010"],
["cp","Size-exclusion chromatography: which elutes first?","Large molecules. Small ones enter the bead pores and take longer.","5C-011"],
["cp","Ion-exchange chromatography?","Separates by charge. An anion-exchange column has positive beads that hold negatively charged molecules.","5C-012"],
["cp","Affinity chromatography?","A column with a ligand or antibody that binds the target protein. Elute with free ligand or a competitor.","5C-013"],
["cp","SDS-PAGE?","SDS-PAGE separates denatured proteins mainly by size/molecular mass because SDS imparts a near-uniform negative charge-to-mass ratio; exceptions occur.","5C-014"],
["cp","Isoelectric focusing?","Proteins move through a pH gradient and stop where pH equals their pI.","5C-015"],
["ps","Three components of emotion?","Physiological (body arousal), behavioral (expression), and cognitive (subjective feeling and appraisal).","6C-006"],
["ps","Role of the prefrontal cortex in emotion?","Regulates emotional responses and links them to decisions. Phineas Gage's injury is the classic example.","6C-007"],
["ps","Eustress vs. distress?","Eustress: positive, motivating stress. Distress: negative, harmful stress.","6C-008"],
["ps","Types of stressors?","Cataclysmic events, major personal events, and daily hassles.","6C-009"],
["ps","HPA axis?","Hypothalamus releases CRH → pituitary releases ACTH → adrenal cortex releases cortisol.","6C-010"],
["ps","Body's immediate stress response?","Sympathetic activation: higher heart rate, blood pressure, and glucose, with epinephrine from the adrenal medulla.","6C-011"],
["ps","Effects of chronic stress?","Weakened immunity, high blood pressure, heart disease, and higher risk of anxiety and depression.","6C-012"],
["ps","Stress management techniques?","Exercise, relaxation and meditation, social support, and spiritual practice.","6C-013"],
["ps","Display rules?","Cultural norms for when and how emotions should be expressed.","6C-014"],
["ps","Facial feedback hypothesis?","Facial expressions can influence the emotions we feel.","6C-015"],
["ps","Kelley's covariation model?","We judge causes of behavior using consistency, distinctiveness, and consensus.","8B-010"],
["ps","Optimism bias?","Believing bad things are more likely to happen to others than to you.","8B-011"],
["ps","Out-group homogeneity bias?","Seeing members of other groups as more alike than members of your own.","8B-012"],
["ps","Contact hypothesis?","Prejudice drops with equal-status, cooperative contact between groups (Allport).","8B-013"],
["ps","False consensus effect?","Overestimating how many people share your beliefs and behaviors.","8B-014"],
["ps","Primacy effect in impressions?","First impressions carry more weight than later information.","8B-015"],
["ps","Status vs. role?","Status: a social position. Role: the behaviors expected of someone in that position.","8C-008"],
["ps","Reference group?","A group people use to judge their own behavior and standing.","8C-009"],
["ps","Dyad vs. triad?","Dyad: two people, ends if one leaves. Triad: three people, more stable but open to coalitions (Simmel).","8C-010"],
["ps","Impression management?","Efforts to control how others see us, including self-presentation and ingratiation.","8C-011"],
["ps","Empathy–altruism hypothesis?","Feeling empathy for someone leads to helping them without selfish motives (Batson).","8C-012"],
["ps","Strength of weak ties?","Acquaintances link us to new information and opportunities more than close friends do (Granovetter).","8C-013"],
["ps","Sternberg's triangular theory of love?","Three components: intimacy, passion, and commitment. Consummate love has all three.","8C-014"],
["ps","Types of social support?","Emotional, informational, tangible (material), and esteem support.","8C-015"],
["ps","Major social institutions?","Family, education, religion, government, economy, and medicine.","9A-010"],
["ps","Secularization?","The declining influence of religion in society.","9A-011"],
["ps","Church vs. sect vs. cult?","Church: large, established. Sect: a group that broke away. Cult (new religious movement): new and outside the mainstream.","9A-012"],
["ps","Capitalism vs. socialism?","Capitalism: private ownership, market-driven. Socialism: collective or state ownership of production.","9A-013"],
["ps","Culture lag?","Nonmaterial culture (norms, values) takes longer to adapt than material culture like technology (Ogburn).","9A-014"],
["ps","Subculture vs. counterculture?","Subculture: a group with distinct practices within society. Counterculture: rejects mainstream values.","9A-015"],
["ps","Crude birth and death rates?","Births or deaths per 1,000 people per year.","9B-005"],
["ps","Replacement-level fertility?","A total fertility rate of about 2.1 children per woman.","9B-006"],
["ps","Population pyramid shapes?","Expansive pyramid (wide base): typically rapid growth. Stationary: roughly balanced age structure. Constrictive (narrow base): low birth rates and an aging population; total population need not already be shrinking.","9B-007"],
["ps","Malthusian theory?","Population grows geometrically while food grows arithmetically, leading to crisis.","9B-008"],
["ps","Urbanization?","The movement of people from rural areas into cities.","9B-009"],
["ps","Suburbanization?","Movement from cities to surrounding suburbs, often by wealthier residents.","9B-010"],
["ps","Race vs. ethnicity?","Race: categories based on perceived physical traits. Ethnicity: shared culture, language, and ancestry. Both are socially constructed.","9B-011"],
["ps","Sex vs. gender?","Sex: biological characteristics. Gender: socially constructed roles and identity.","9B-012"],
["ps","Types of social movements?","Alternative, redemptive, reformative, revolutionary (Aberle).","9B-013"],
["ps","Relative deprivation theory?","Social movements form when people feel deprived compared to others or to what they expect.","9B-014"],
["ps","Globalization?","Growing worldwide integration of economies, cultures, and communication.","9B-015"],
["ps","Socioeconomic status (SES)?","A combined measure of income, education, and occupation.","10A-007"],
["ps","Weber's three dimensions of stratification?","Class (economic position), status (prestige), and power (political influence).","10A-008"],
["ps","Meritocracy?","A system where position is earned through ability and effort. Critics argue it hides structural advantages.","10A-009"],
["ps","Individual vs. institutional discrimination?","Individual: one person's unfair treatment of another. Institutional: unfair treatment built into organizations and policies.","10A-010"],
["ps","Social capital?","Resources gained through social networks and relationships.","10A-011"],
["ps","Residential segregation?","Separation of groups into different neighborhoods by race or income.","10A-012"],
["ps","Environmental justice?","The unequal exposure of poor and minority communities to pollution and hazards.","10A-013"],
["ps","Health disparities?","Differences in health outcomes between groups, linked to SES, race, and access to care. Lower SES tracks with worse health.","10A-014"],
["ps","Glass ceiling?","An invisible barrier keeping women and minorities from top positions.","10A-015"],
["bb","Primary structure of a protein?","The amino acid sequence, held together by peptide bonds.","1A-001"],
["bb","Secondary structure of a protein?","Local folding into α-helices and β-sheets, stabilized by hydrogen bonds between backbone groups.","1A-002"],
["bb","Tertiary structure of a protein?","The 3D fold of a single chain, held by hydrophobic interactions, hydrogen bonds, ionic bonds, and disulfide bridges.","1A-003"],
["bb","Quaternary structure of a protein?","Multiple polypeptide subunits assembled together, as in hemoglobin.","1A-004"],
["bb","Which amino acid forms disulfide bonds?","Cysteine. Two cysteines oxidize to form cystine.","1A-005"],
["bb","Which amino acid tends to break α-helices?","Proline. Its rigid ring limits backbone rotation.","1A-006"],
["bb","Aromatic amino acids?","Phenylalanine, tyrosine, tryptophan.","1A-007"],
["bb","Sulfur-containing amino acids?","Cysteine and methionine.","1A-008"],
["bb","Do enzymes change ΔG or equilibrium?","No. They lower activation energy and speed both directions equally.","1A-009"],
["bb","Cofactor vs. coenzyme?","Cofactor: usually an inorganic helper, like a metal ion. Coenzyme: an organic helper, often derived from a vitamin.","1A-010"],
["bb","Allosteric regulation?","A molecule binds a site other than the active site and changes the enzyme's activity.","1A-011"],
["bb","Shape of a cooperative binding curve?","Sigmoidal (S-shaped), as with hemoglobin.","1A-012"],
["bb","Zymogen?","An inactive enzyme precursor activated by cleavage, such as trypsinogen becoming trypsin.","1A-013"],
["bb","What activates trypsinogen?","Enteropeptidase (enterokinase) in the duodenum. Trypsin then activates other pancreatic zymogens.","1A-014"],
["bb","Six enzyme classes?","Oxidoreductases, transferases, hydrolases, lyases, isomerases, ligases.","1A-015"],
["bb","Kinase vs. phosphatase?","Kinase adds a phosphate group; phosphatase removes one.","1A-016"],
["bb","Where does glycolysis occur?","The cytoplasm.","1D-001"],
["bb","Products of pyruvate dehydrogenase?","Acetyl-CoA, CO<sub>2</sub>, and NADH.","1D-002"],
["bb","Citric acid cycle yield per acetyl-CoA?","3 NADH, 1 FADH<sub>2</sub>, 1 GTP, and 2 CO<sub>2</sub>.","1D-003"],
["bb","Which enzyme is in both the citric acid cycle and the ETC?","Succinate dehydrogenase (Complex II).","1D-004"],
["bb","What drives ATP synthase?","The proton gradient. H<sup>+</sup> flows from the intermembrane space back into the matrix.","1D-005"],
["bb","Purpose of fermentation?","Regenerating NAD<sup>+</sup> so glycolysis can keep running without oxygen.","1D-006"],
["bb","Pentose phosphate pathway products?","NADPH and ribose-5-phosphate. Rate-limiting enzyme: glucose-6-phosphate dehydrogenase.","1D-007"],
["bb","Key enzymes of glycogen metabolism?","Synthesis: glycogen synthase. Breakdown: glycogen phosphorylase.","1D-008"],
["bb","Fatty acid synthesis: location and rate-limiting enzyme?","Cytoplasm; acetyl-CoA carboxylase.","1D-009"],
["bb","Where does β-oxidation occur?","Most fatty-acid beta-oxidation occurs in the mitochondrial matrix; long-chain fatty acyl groups use the carnitine shuttle, while very-long-chain fatty acids are initially shortened in peroxisomes.","1D-010"],
["bb","Ketone bodies: where and when?","Made in the liver during fasting or starvation. Mainly acetoacetate and β-hydroxybutyrate.","1D-011"],
["bb","Rate-limiting enzyme of cholesterol synthesis?","HMG-CoA reductase, the target of statins.","1D-012"],
["bb","Where does the urea cycle occur?","The liver, split between the mitochondria and the cytoplasm.","1D-013"],
["bb","Saturated vs. unsaturated fatty acids?","Saturated: no C=C bonds, pack tightly, solid at room temperature. Unsaturated: cis double bonds kink the chain, liquid.","1D-014"],
["bb","How does cholesterol affect membrane fluidity?","It buffers it: lowers fluidity at high temperature and raises it at low temperature.","2A-001"],
["bb","Fluid mosaic model?","A phospholipid bilayer with proteins and lipids that move laterally within it.","2A-002"],
["bb","Passive vs. active transport?","Passive moves down a gradient without energy. Active moves against a gradient using ATP or another gradient.","2A-003"],
["bb","Secondary active transport?","Uses a gradient built by a primary pump, like the Na<sup>+</sup>–glucose symporter.","2A-004"],
["bb","Which way does water move in osmosis?","Toward the side with higher solute concentration.","2A-005"],
["bb","Cell in a hypotonic solution?","Water rushes in; the cell swells and may lyse.","2A-006"],
["bb","Purines vs. pyrimidines?","Purines (two rings): adenine, guanine. Pyrimidines (one ring): cytosine, thymine, uracil.","1B-001"],
["bb","Hydrogen bonds per base pair?","A–T: 2. G–C: 3. More G–C means a higher melting temperature.","1B-002"],
["bb","Chargaff's rule?","In double-stranded DNA, %A = %T and %G = %C.","1B-003"],
["bb","DNA vs. RNA sugar?","DNA: deoxyribose (no 2′-OH). RNA: ribose (has a 2′-OH).","1B-004"],
["bb","Role of helicase?","Unwinds the DNA double helix at the replication fork.","1B-005"],
["bb","Role of topoisomerase?","Relieves supercoiling ahead of the replication fork.","1B-006"],
["bb","Role of primase?","Lays down short RNA primers so DNA polymerase can start.","1B-007"],
["bb","What does DNA polymerase need to begin?","A primer with a free 3′-OH. It reads the template 3′→5′ and builds 5′→3′.","1B-008"],
["bb","Telomerase?","A reverse transcriptase with its own RNA template that extends telomeres. Active in stem cells, germ cells, and most cancers.","1B-009"],
["bb","What does RNA polymerase II make?","mRNA in eukaryotes. Pol I makes most rRNA; Pol III makes tRNA and 5S rRNA.","1B-010"],
["bb","Eukaryotic mRNA processing?","5′ cap, 3′ poly-A tail, and splicing out of introns by the spliceosome.","1B-011"],
["bb","Introns vs. exons?","Introns are removed from pre-mRNA. Exons remain in mature RNA; some exonic regions are untranslated (UTRs).","1B-012"],
["bb","Alternative splicing?","Different exon combinations from one gene, producing multiple proteins.","1B-013"],
["bb","Wobble position?","Wobble usually involves pairing between the third base of the mRNA codon and the first base of the tRNA anticodon, allowing a tRNA to recognize multiple synonymous codons.","1B-014"],
["bb","Order of ribosome sites?","A (aminoacyl-tRNA enters), P (peptidyl), E (exit).","1B-015"],
["bb","Prokaryotic vs. eukaryotic ribosomes?","Prokaryotic: 70S (50S + 30S). Eukaryotic: 80S (60S + 40S).","1B-016"],
["bb","Lac operon with lactose present and glucose absent?","On. The repressor is released and high cAMP activates CAP.","1B-017"],
["bb","How is the trp operon regulated?","Repressible. Tryptophan binds the repressor, which then shuts the operon off.","1B-018"],
["bb","Silent, missense, nonsense mutations?","Silent: same amino acid. Missense: different amino acid. Nonsense: premature stop codon.","1B-019"],
["bb","Frameshift mutation?","An insertion or deletion not a multiple of 3 that shifts the reading frame.","1B-020"],
["bb","Effect of histone acetylation?","Loosens chromatin and increases transcription.","1B-021"],
["bb","Effect of DNA methylation?","Usually silences genes, often at CpG islands.","1B-022"],
["bb","Heterochromatin vs. euchromatin?","Heterochromatin: condensed, mostly silent. Euchromatin: loose, actively transcribed.","1B-023"],
["bb","Phases of the cell cycle?","G1, S (DNA replication), G2, M (mitosis). G0 is a resting state.","2C-001"],
["bb","Role of p53?","A tumor suppressor that halts the cycle at G1/S for DNA repair or triggers apoptosis.","2C-002"],
["bb","Proto-oncogene?","A normal growth gene. A gain-of-function mutation turns it into an oncogene.","2C-003"],
["bb","When does crossing over happen?","Prophase I, between homologous chromosomes.","1C-001"],
["bb","Nondisjunction?","Chromosomes fail to separate, causing aneuploidy, like trisomy 21.","1C-002"],
["bb","Why do X-linked recessive traits show up more in males?","Males have one X, so one recessive allele is expressed. They inherit it from their mother.","1C-003"],
["bb","Mendel's law of segregation?","Each parent's two alleles separate so each gamete gets one.","1C-004"],
["bb","Law of independent assortment?","Genes on different chromosomes sort into gametes independently.","1C-005"],
["bb","Recombination frequency and map distance?","1% recombination frequency corresponds to 1 centimorgan. Recombination frequency approaches a maximum of 50% as genes become widely separated.","1C-006"],
["bb","Incomplete dominance vs. codominance?","Incomplete: a blend (red × white = pink). Codominance: both shown fully (AB blood type).","1C-007"],
["bb","Penetrance vs. expressivity?","Penetrance: the share of people with a genotype who show the trait. Expressivity: how strongly it shows.","1C-008"],
["bb","Bottleneck vs. founder effect?","Bottleneck: sharp reduction in population size. Founder effect: a few individuals establish a population. Both can reduce genetic variation relative to the source population.","1C-009"],
["bb","Three ways bacteria exchange DNA?","Transformation (take up free DNA), transduction (via a virus), conjugation (via a pilus).","2B-001"],
["bb","Gram-positive vs. gram-negative?","Positive: thick peptidoglycan, stains purple. Negative: thin peptidoglycan plus an outer membrane with LPS, stains pink.","2B-002"],
["bb","Lytic vs. lysogenic cycle?","Lytic: replicate and burst the cell. Lysogenic: integrate into the host genome as a prophage.","2B-003"],
["bb","Retrovirus?","An RNA virus that uses reverse transcriptase to make DNA and integrate it, like HIV.","2B-004"],
["bb","Evidence for endosymbiosis?","Mitochondria and chloroplasts have double membranes, their own circular DNA, and 70S-like ribosomes.","2A-007"],
["bb","Rough ER vs. smooth ER?","Rough: ribosomes, makes secreted and membrane proteins. Smooth: lipid synthesis, detoxification, Ca<sup>2+</sup> storage.","2A-008"],
["bb","Role of the Golgi apparatus?","Modifies, sorts, and packages proteins for their destinations.","2A-009"],
["bb","Lysosome?","Holds hydrolytic enzymes at acidic pH (about 5) to break down cell material.","2A-010"],
["bb","Peroxisome?","Breaks down very long-chain fatty acids and handles H<sub>2</sub>O<sub>2</sub> with catalase.","2A-011"],
["bb","What are microtubules made of and used for?","Tubulin. Used in the mitotic spindle, cilia, flagella (9+2 arrangement), and transport.","2A-012"],
["bb","What are microfilaments made of and used for?","Actin. Used in cytokinesis, muscle contraction, and cell movement.","2A-013"],
["bb","Tight junctions?","Seal neighboring cells to block leakage between them.","2A-014"],
["bb","Gap junctions?","Channels (connexons) letting ions and small molecules pass directly between cells.","2A-015"],
["bb","Desmosomes?","Anchor cells together to resist mechanical stress.","2A-016"],
["bb","What does ectoderm become?","Nervous system and epidermis (skin, hair, nails).","2C-004"],
["bb","What does mesoderm become?","Muscle, bone, blood, heart, kidneys, and gonads.","2C-005"],
["bb","What does endoderm become?","Lining of the GI and respiratory tracts, plus liver and pancreas.","2C-006"],
["bb", "What triggers the acrosome reaction in sperm, and what is its function?", "The acrosome reaction is an exocytotic process in which the sperm releases enzymes and exposes proteins that help it penetrate the egg's surrounding layers. It can be initiated by signals encountered in the cumulus–zona pellucida environment. The sperm subsequently fuses with the oocyte plasma membrane (oolemma), not the zona pellucida.", "2C-007"],
["bb","Cortical reaction?","Released granules harden the zona pellucida to block polyspermy.","2C-008"],
["bb","Myelin in the CNS vs. PNS?","CNS: oligodendrocytes. PNS: Schwann cells.","3A-001"],
["bb","Saltatory conduction?","The action potential jumps between nodes of Ranvier along myelinated axons, speeding conduction.","3A-002"],
["bb","Absolute vs. relative refractory period?","Absolute: no new action potential possible. Relative: possible, but needs a stronger stimulus.","3A-003"],
["bb","What triggers neurotransmitter release?","Ca<sup>2+</sup> influx through voltage-gated channels at the axon terminal.","3A-004"],
["bb","Which sarcomere regions shorten during contraction?","The H zone and I band. The A band stays the same length.","3B-001"],
["bb","Role of Ca<sup>2+</sup> in skeletal muscle contraction?","Binds troponin, which shifts tropomyosin to expose myosin-binding sites on actin.","3B-002"],
["bb","What releases myosin from actin?","ATP binding to the myosin head.","3B-003"],
["bb","Three muscle types?","Skeletal: striated, voluntary, multinucleated. Cardiac: striated, involuntary, intercalated discs. Smooth: not striated, involuntary.","3B-004"],
["bb","Path of blood through the heart?","RA → tricuspid valve → RV → pulmonary valve → pulmonary arteries → lungs → pulmonary veins → LA → mitral valve → LV → aortic valve → aorta.","3B-005"],
["bb","Arteries vs. veins?","Arteries carry blood away from the heart; veins carry it toward the heart. The pulmonary artery carries deoxygenated blood.","3B-006"],
["bb","Role of surfactant?","Lowers surface tension in the alveoli so they don't collapse.","3B-007"],
["bb","How is most CO<sub>2</sub> carried in blood?","As bicarbonate, formed by carbonic anhydrase in red blood cells.","3B-008"],
["bb","B cells vs. T cells?","B cells make antibodies (humoral). T cells: helper (CD4) coordinate; cytotoxic (CD8) kill infected cells.","3B-009"],
["bb","MHC I vs. MHC II?","MHC I: on all nucleated cells, presents to CD8 T cells. MHC II: on antigen-presenting cells, presents to CD4 T cells.","3B-010"],
["bb","Innate vs. adaptive immunity?","Innate: fast, nonspecific. Adaptive: slower, specific, with memory.","3B-011"],
["bb","Steroid vs. peptide hormones?","Steroid: lipid-soluble, intracellular receptors, change transcription. Peptide: surface receptors, second messengers.","3A-005"],
["bb","Anterior pituitary hormones?","FSH, LH, ACTH, TSH, prolactin, GH (FLAT PiG).","3A-006"],
["bb","Posterior pituitary hormones?","ADH and oxytocin. Made in the hypothalamus, released from the posterior pituitary.","3A-007"],
["bb","PTH vs. calcitonin?","PTH raises blood Ca<sup>2+</sup>. Calcitonin lowers it.","3A-008"],
["bb","What does cortisol do?","Raises blood glucose and suppresses immune response. Made in the adrenal cortex.","3A-009"],
["bb","Where is epinephrine made?","The adrenal medulla.","3A-010"],
["bb","Thyroid hormones?","T3 and T4. They raise metabolic rate and require iodine.","3A-011"],
["bb","What triggers ovulation?","The LH surge.","3B-012"],
["bb","What does the corpus luteum secrete?","Progesterone (and some estrogen).","3B-013"],
["bb","Role of hCG?","Keeps the corpus luteum going in early pregnancy.","3B-014"],
["bb","How are fats digested?","Bile salts emulsify them; pancreatic lipase breaks them down.","3B-015"],
["bb","Sections of the small intestine?","Duodenum, jejunum, ileum. Most absorption in jejunum and ileum; B12 absorbed in the ileum.","3B-016"],
["bb","Secretin vs. CCK?","Secretin: pancreas releases bicarbonate. CCK: gallbladder releases bile and pancreas releases enzymes.","3B-017"],
["bb","What drives glomerular filtration?","Hydrostatic (blood) pressure in the glomerulus.","3B-018"],
["bb","What does the proximal tubule reabsorb?","Nearly all glucose and amino acids, plus most Na<sup>+</sup> and water.","3B-019"],
["cp","Avogadro's number?","6.022 × 10<sup>23</sup> particles per mole.","4E-001"],
["cp","Molarity?","Moles of solute per liter of solution.","5A-001"],
["cp","Molality?","Moles of solute per kilogram of solvent.","5A-002"],
["cp","Limiting reagent?","The reactant that runs out first and sets how much product forms.","4E-002"],
["cp","Percent yield?","(Actual yield ÷ theoretical yield) × 100.","4E-003"],
["cp","Four quantum numbers?","n (energy level), l (subshell shape), m<sub>l</sub> (orbital orientation), m<sub>s</sub> (spin).","4E-004"],
["cp","Pauli exclusion principle?","No two electrons in an atom share all four quantum numbers.","4E-005"],
["cp","Hund's rule?","Fill degenerate orbitals one electron each, with parallel spins, before pairing.","4E-006"],
["cp","Atomic radius trend?","Increases down a group; decreases left to right across a period.","4E-007"],
["cp","Ionization energy trend?","Increases up a group and left to right. Noble gases are highest.","4E-008"],
["cp","Isotopes?","Same number of protons, different numbers of neutrons.","4E-009"],
["cp","Photon energy?","E = hf = hc/λ.","4E-010"],
["cp","Formal charge?","Valence electrons − nonbonding electrons − ½ bonding electrons.","5B-001"],
["cp","Sigma and pi bonds in single, double, triple bonds?","Single: 1σ. Double: 1σ + 1π. Triple: 1σ + 2π.","5B-002"],
["cp","Bond length vs. bond strength?","Shorter bonds are stronger. Triple bonds are shortest and strongest.","5B-003"],
["cp","Intermolecular forces, strongest to weakest?","Intermolecular-force strengths depend on the molecules involved. Hydrogen bonding and ion–dipole interactions are often strong, but London dispersion can dominate for large, highly polarizable species; there is no universal ranking.","5B-004"],
["cp","What's needed for hydrogen bonding?","A hydrogen-bond donor usually has H bonded to N, O, or F; a hydrogen-bond acceptor must have an available electron pair, often on N, O, or F.","5B-005"],
["cp","Shape with 4 electron domains and 2 lone pairs?","Bent, about 104.5° (water).","5B-006"],
["cp","Shape of NH<sub>3</sub>?","Trigonal pyramidal, about 107°.","5B-007"],
["cp","How do IMFs affect boiling point?","Stronger intermolecular forces mean a higher boiling point.","5B-008"],
["cp","When does a liquid boil?","When its vapor pressure equals the external pressure.","5E-001"],
["cp","Triple point?","The temperature and pressure where solid, liquid, and gas coexist.","5E-002"],
["cp","Critical point?","Beyond it, liquid and gas can't be told apart (supercritical fluid).","5E-003"],
["cp","Heat absorbed with a temperature change?","q = mcΔT.","5E-004"],
["cp","What happens to temperature during a phase change?","It stays constant. Heat goes into the change: q = mL.","5E-005"],
["cp","Hess's law?","The ΔH of a reaction equals the sum of ΔH for its steps.","5E-006"],
["cp","Exothermic vs. endothermic?","Exothermic: ΔH &lt; 0, releases heat. Endothermic: ΔH &gt; 0, absorbs heat.","5E-007"],
["cp","What increases entropy?","Entropy often rises with greater dispersal of matter or energy, e.g., melting, vaporization, or increasing gas particle number. Dissolving does not always increase entropy.","5E-008"],
["cp","First law of thermodynamics?","ΔU = Q − W, where W is work done by the system.","5E-009"],
["cp","Reaction quotient Q vs. K?","Q &lt; K: shifts forward. Q &gt; K: shifts reverse. Q = K: at equilibrium.","5E-010"],
["cp","Effect of a catalyst on equilibrium?","None. It speeds forward and reverse equally and reaches equilibrium faster.","5E-011"],
["cp","Raising temperature on an exothermic equilibrium?","Shifts toward reactants and lowers K.","5E-012"],
["cp","Arrhenius equation?","k = A·e<sup>−Ea/RT</sup>. Higher temperature or lower Ea means a faster rate.","5E-013"],
["cp","Rate-determining step?","The slowest step in a mechanism.","5E-014"],
["cp","First-order half-life?","t½ = 0.693/k. Independent of concentration.","5E-015"],
["cp","K<sub>w</sub> at 25 °C?","1.0 × 10<sup>−14</sup>, so pH + pOH = 14.","5A-003"],
["cp","The strong acids?","Common strong acids in water: HCl, HBr, HI, HNO<sub>3</sub>, HClO<sub>4</sub>, and H<sub>2</sub>SO<sub>4</sub> (strong for its first dissociation; its second dissociation is not complete).","5A-004"],
["cp","pK<sub>a</sub> and acid strength?","pK<sub>a</sub> = −log K<sub>a</sub>. Lower pK<sub>a</sub> means a stronger acid.","5A-005"],
["cp","Conjugate base of a strong acid?","Very weak; essentially no basic behavior in water.","5A-006"],
["cp","Effective range of a buffer?","pH = pK<sub>a</sub> ± 1.","5A-007"],
["cp","Blood bicarbonate buffer?","CO<sub>2</sub> + H<sub>2</sub>O ⇌ H<sub>2</sub>CO<sub>3</sub> ⇌ H<sup>+</sup> + HCO<sub>3</sub><sup>−</sup>.","5A-008"],
["cp","Lewis acid?","An electron-pair acceptor.","5A-009"],
["cp","Brønsted–Lowry acid?","A proton (H<sup>+</sup>) donor.","5A-010"],
["cp","pH at the equivalence point, weak acid titrated with strong base?","Above 7, because the conjugate base is left in solution.","5A-011"],
["cp","Common ion effect?","Adding an ion already in the equilibrium lowers the salt's solubility.","5A-012"],
["cp","OIL RIG?","Oxidation Is Loss of electrons; Reduction Is Gain.","4C-001"],
["cp","What happens to an oxidizing agent?","It gets reduced.","4C-002"],
["cp","Electrolytic cell?","Nonspontaneous (E &lt; 0), driven by outside power. Oxidation still at the anode, which is positive here.","4C-003"],
["cp","Sign of the anode in a galvanic cell?","Negative.","4C-004"],
["cp","Faraday's constant?","About 96,485 C per mole of electrons.","4C-005"],
["cp","Nernst equation?","E = E° − (RT/nF) ln Q.","4C-006"],
["cp","Standard cell potential?","E°<sub>cell</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub>.","4C-007"],
["cp","Chiral center?","A carbon bonded to four different groups.","5B-009"],
["cp","Enantiomers vs. diastereomers?","Enantiomers: non-superimposable mirror images. Diastereomers: stereoisomers that are not mirror images.","5B-010"],
["cp","Meso compound?","Has chiral centers but an internal plane of symmetry, so it's achiral.","5B-011"],
["cp","Assigning R or S?","Rank by atomic number, point the lowest priority away, trace 1→2→3. Clockwise = R.","5B-012"],
["cp","Racemic mixture?","50:50 enantiomers; no net optical rotation.","5B-013"],
["cp","E vs. Z alkenes?","Higher-priority groups on the same side = Z; opposite sides = E.","5B-014"],
["cp","Nucleophile vs. electrophile?","Nucleophile: electron-rich, donates a pair. Electrophile: electron-poor, accepts a pair.","5D-001"],
["cp","Good leaving groups?","Weak bases: I<sup>−</sup>, Br<sup>−</sup>, Cl<sup>−</sup>, tosylate, water.","5D-002"],
["cp","E2 requirements?","Strong base, one step, with the H and leaving group anti-periplanar.","5D-003"],
["cp","Zaitsev's rule?","The more substituted alkene is the major elimination product.","5D-004"],
["cp","Carbocation stability order?","Tertiary > secondary > primary > methyl. Resonance also stabilizes.","5D-005"],
["cp","What happens when you oxidize an aldehyde vs. a ketone?","Aldehydes oxidize to carboxylic acids. Ketones resist further oxidation.","5D-006"],
["cp","Primary alcohol with PCC vs. a strong oxidant?","PCC stops at the aldehyde. Strong oxidants (CrO<sub>3</sub>/H<sub>2</sub>SO<sub>4</sub>, KMnO<sub>4</sub>) go to the carboxylic acid.","5D-007"],
["cp","NaBH<sub>4</sub> vs. LiAlH<sub>4</sub>?","NaBH<sub>4</sub> is mild (aldehydes, ketones). LiAlH<sub>4</sub> is strong and also reduces esters and carboxylic acids.","5D-008"],
["cp","Reactivity of carboxylic acid derivatives?","Acyl halide > anhydride > ester > amide.","5D-009"],
["cp","Aldol reaction?","An enolate attacks a carbonyl, giving a β-hydroxy carbonyl.","5D-010"],
["cp","Keto–enol tautomerism?","Fast interconversion between forms. The keto form is usually favored.","5D-011"],
["cp","Acetal formation?","Aldehyde or ketone + 2 alcohols, with acid. Often used as a protecting group.","5D-012"],
["cp","Imine formation?","Aldehyde or ketone + primary amine, losing water.","5D-013"],
["cp","Fischer esterification?","Carboxylic acid + alcohol, with acid catalyst, makes an ester.","5D-014"],
["cp","Saponification?","Base hydrolysis of an ester. Fats become soap.","5D-015"],
["cp","Hückel's rule for aromaticity?","Cyclic, planar, fully conjugated, with 4n + 2 π electrons.","5D-016"],
["cp","Gabriel synthesis?","Makes primary amines (and amino acids) using phthalimide.","5D-017"],
["cp","Strecker synthesis?","Makes amino acids from an aldehyde, ammonia, and cyanide.","5D-018"],
["cp","¹H NMR splitting rule?","In simple first-order ¹H NMR splitting, n equivalent neighboring hydrogens typically give n+1 peaks; coupling to nonequivalent sets can produce more complex patterns.","4D-001"],
["cp","¹H NMR shifts for aldehyde and carboxylic acid H?","Aldehyde: about 9–10 ppm. Carboxylic acid: about 10–12 ppm.","4D-002"],
["cp","What does mass spectrometry measure?","Mass spectrometry measures mass-to-charge ratio (m/z). An intact molecular-ion or protonated-molecule peak can help determine molecular mass, depending on ionization method.","4E-011"],
["cp","Simple vs. fractional distillation?","Separate by boiling point. Use fractional when boiling points are within about 25 °C.","5C-001"],
["cp","Extraction?","Separates compounds by solubility between two immiscible layers, often with acid or base washes.","5C-002"],
["cp","R<sub>f</sub> in TLC on silica?","Distance traveled by compound ÷ distance by solvent. Polar compounds stick more and have lower R<sub>f</sub>.","5C-003"],
["cp","Gel electrophoresis?","DNA moves toward the positive anode. Smaller fragments travel farther.","5C-004"],
["cp","Vector vs. scalar?","Vectors have magnitude and direction (velocity, force). Scalars have magnitude only (speed, mass).","4A-001"],
["cp","Launch angle for maximum range on level ground?","45°, ignoring air resistance.","4A-002"],
["cp","Horizontal velocity of a projectile?","Constant, with no air resistance. Only vertical velocity changes.","4A-003"],
["cp","Friction force?","Kinetic friction: f<sub>k</sub> = μ<sub>k</sub>N. Static friction adjusts as needed up to f<sub>s,max</sub> = μ<sub>s</sub>N; it is not always equal to μ<sub>s</sub>N.","4A-004"],
["cp","Forces on an incline?","Along the slope: mg sin θ. Into the slope (normal): mg cos θ.","4A-005"],
["cp","Centripetal acceleration?","a = v²/r, pointed toward the center.","4A-006"],
["cp","Torque?","τ = rF sin θ.","4A-007"],
["cp","Momentum and impulse?","p = mv. Impulse = FΔt = Δp.","4A-008"],
["cp","Elastic vs. inelastic collisions?","Both conserve momentum. Only elastic conserves kinetic energy. Perfectly inelastic: objects stick together.","4A-009"],
["cp","Hooke's law and spring energy?","F = −kx; PE = ½kx².","4A-010"],
["cp","Conservation of mechanical energy?","Without friction or other nonconservative forces, KE + PE stays constant.","4A-011"],
["cp","Density and specific gravity?","ρ = m/V. Specific gravity = ρ ÷ 1000 kg/m³ (water).","4B-001"],
["cp","Pressure at depth in a fluid?","P = P<sub>0</sub> + ρgh.","4B-002"],
["cp","Pascal's principle?","Pressure applied to an enclosed fluid is transmitted equally throughout (hydraulic lift).","4B-003"],
["cp","Poiseuille's law: key takeaway?","Flow rate is proportional to r⁴. A small change in vessel radius has a big effect.","4B-004"],
["cp","Coulomb's law?","F = kq₁q₂/r².","4C-008"],
["cp","Electric field from a point charge?","E = F/q = kQ/r².","4C-009"],
["cp","Electric potential energy and potential?","U = kq₁q₂/r. V = kQ/r.","4C-010"],
["cp","Electrical power?","P = IV = I²R = V²/R.","4C-011"],
["cp","Capacitors in series vs. parallel?","Parallel: C values add. Series: reciprocals add. The opposite of resistors.","4C-012"],
["cp","Effect of a dielectric?","Raises capacitance by its dielectric constant κ.","4C-013"],
["cp","Resistance of a wire?","R = ρL/A. Longer is higher resistance; thicker is lower.","4C-014"],
["cp","Magnetic force on a moving charge?","F = qvB sin θ.","4C-015"],
["cp","Wave speed?","v = fλ.","4D-003"],
["cp","Where does sound travel fastest?","Solids, then liquids, then gases.","4D-004"],
["cp","Harmonics in a pipe closed at one end?","Odd harmonics only. λ = 4L/n, with n = 1, 3, 5…","4D-005"],
["cp","Harmonics on a string or open pipe?","All harmonics. λ = 2L/n.","4D-006"],
["cp","Index of refraction?","n = c/v.","4D-007"],
["cp","Total internal reflection?","Going from higher n to lower n, past the critical angle.","4D-008"],
["cp","Real vs. virtual images?","Real: inverted, can be projected. Virtual: upright, cannot be projected.","4D-009"],
["cp","Lens power?","P = 1/f, in diopters, with f in meters.","4D-010"],
["cp","EM spectrum, low to high energy?","Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.","4D-011"],
["cp","Visible light wavelengths?","About 400 nm (violet) to 700 nm (red).","4D-012"],
["cp","Photoelectric effect?","KE<sub>max</sub> = hf − W, where W is the work function.","4D-013"],
["cp","Gamma decay?","Releases energy; mass number and atomic number don't change.","4E-012"],
["cp","Positron emission?","Atomic number goes down by 1; mass number unchanged.","4E-013"],
["cp","Electron capture?","Atomic number goes down by 1; mass number unchanged.","4E-014"],
["ps","Sensation vs. perception?","Sensation: detecting stimuli. Perception: organizing and interpreting them.","6A-001"],
["ps","Absolute threshold?","The minimum stimulus intensity detected 50% of the time.","6A-002"],
["ps","Sensory adaptation?","Lower sensitivity to a constant stimulus over time.","6A-003"],
["ps","Bottom-up vs. top-down processing?","Bottom-up: built from raw sensory input. Top-down: guided by expectations and knowledge.","6A-004"],
["ps","Gestalt principles?","Proximity, similarity, continuity, closure, and Prägnanz (simplest interpretation).","6A-005"],
["ps","Rods vs. cones?","Rods: dim light, periphery, no color. Cones: color and detail, concentrated in the fovea.","6A-006"],
["ps","What crosses at the optic chiasm?","Fibers from the nasal half of each retina.","6A-007"],
["ps","Feature detectors?","Visual cortex neurons tuned to edges, lines, and angles (Hubel and Wiesel).","6A-008"],
["ps","Where is sound transduced?","Hair cells on the basilar membrane of the cochlea.","6A-009"],
["ps","Place theory vs. frequency theory?","Place: pitch depends on where the basilar membrane vibrates (high pitches). Frequency: on firing rate (low pitches).","6A-010"],
["ps","Vestibular system?","Semicircular canals detect rotation. Utricle and saccule detect linear acceleration and gravity.","6A-011"],
["ps","Gate control theory of pain?","Signals in the spinal cord can block pain signals from reaching the brain.","6A-012"],
["ps","Five basic tastes?","Sweet, sour, salty, bitter, umami.","6A-013"],
["ps","Habituation vs. dishabituation?","Habituation: responding less to a repeated stimulus. Dishabituation: the response returns after a change.","7C-001"],
["ps","Generalization vs. discrimination?","Generalization: responding to similar stimuli. Discrimination: responding only to the specific conditioned stimulus.","7C-002"],
["ps","Extinction and spontaneous recovery?","Extinction: the response fades when unpaired. Spontaneous recovery: it briefly comes back after a pause.","7C-003"],
["ps","Four reinforcement schedules?","Fixed-ratio, variable-ratio, fixed-interval, variable-interval.","7C-004"],
["ps","Shaping?","Reinforcing closer and closer approximations of a target behavior.","7C-005"],
["ps","Observational learning?","Learning by watching others. Bandura's Bobo doll study.","7C-006"],
["ps","Escape vs. avoidance learning?","Escape: behavior ends an unpleasant stimulus. Avoidance: behavior prevents it.","7C-007"],
["ps","Levels of processing?","Deeper (semantic) encoding is remembered better than shallow (visual or acoustic) encoding.","6B-001"],
["ps","Iconic vs. echoic memory?","Iconic (visual) lasts under a second. Echoic (auditory) lasts a few seconds.","6B-002"],
["ps","Short-term memory capacity?","Classic Miller estimate: about 7 ± 2 chunks; more recent estimates put immediate capacity near 4 chunks. Unrehearsed short-term information often decays within tens of seconds.","6B-003"],
["ps","Baddeley's working memory model?","Central executive, phonological loop, visuospatial sketchpad, episodic buffer.","6B-004"],
["ps","Explicit vs. implicit memory?","Explicit: conscious recall (facts, events). Implicit: unconscious (skills, priming).","6B-005"],
["ps","Episodic vs. semantic memory?","Episodic: personal experiences. Semantic: general facts.","6B-006"],
["ps","Procedural memory?","Implicit memory for skills, involving the basal ganglia and cerebellum.","6B-007"],
["ps","Priming?","Exposure to one stimulus unconsciously affects response to a later one.","6B-008"],
["ps","Serial position effect?","Better recall of the first items (primacy) and last items (recency) in a list.","6B-009"],
["ps","Proactive vs. retroactive interference?","Proactive: old info blocks new. Retroactive: new info blocks old.","6B-010"],
["ps","Retrograde vs. anterograde amnesia?","Retrograde: losing memories from before. Anterograde: can't form new memories.","6B-011"],
["ps","Long-term potentiation?","Lasting strengthening of synapses with repeated activation. A basis of learning.","6B-012"],
["ps","Misinformation effect?","Misleading information after an event distorts memory of it (Loftus).","6B-013"],
["ps","Alzheimer's disease?","Progressive memory loss with amyloid plaques, tau tangles, and loss of acetylcholine neurons.","6B-014"],
["ps","Availability vs. representativeness heuristic?","Availability: judging likelihood by how easily examples come to mind. Representativeness: by how well something fits a prototype.","6B-015"],
["ps","Confirmation bias?","Seeking and favoring information that supports what you already believe.","6B-016"],
["ps","Belief perseverance?","Holding a belief even after the evidence for it is discredited.","6B-017"],
["ps","Functional fixedness?","Seeing objects only in their usual use, which blocks creative solutions.","6B-018"],
["ps","Mental set?","Sticking with approaches that worked before, even when they don't fit.","6B-019"],
["ps","Fluid vs. crystallized intelligence?","Fluid: reasoning through new problems, declines with age. Crystallized: accumulated knowledge, stable or rising.","6B-020"],
["ps","Gardner's theory of intelligence?","Multiple intelligences, such as linguistic, logical-mathematical, spatial, musical, bodily, interpersonal, intrapersonal.","6B-021"],
["ps","Sapir–Whorf hypothesis?","Language shapes how we think and perceive (linguistic relativity).","6B-022"],
["ps","Language components?","Phonemes (sounds), morphemes (meaning units), syntax (structure), semantics (meaning), pragmatics (context).","6B-023"],
["ps","Theories of language acquisition?","Nativist (Chomsky's language acquisition device), learning (Skinner's reinforcement), interactionist (biology plus social interaction).","6B-024"],
["ps","What controls circadian rhythm?","The suprachiasmatic nucleus of the hypothalamus, with melatonin from the pineal gland.","6B-025"],
["ps","EEG waves by state?","Beta: alert. Alpha: relaxed awake. Theta: stage 1. Sleep spindles and K-complexes: stage 2. Delta: stage 3 deep sleep.","6B-026"],
["ps","Brain's reward pathway?","Mesolimbic dopamine: ventral tegmental area to nucleus accumbens.","7A-001"],
["ps","Drive-reduction theory?","Motivation comes from reducing internal drives from unmet needs, like hunger.","7A-002"],
["ps","Arousal theory?","People seek an optimal level of arousal, not just drive reduction.","7A-003"],
["ps","Intrinsic vs. extrinsic motivation?","Intrinsic: doing it for its own sake. Extrinsic: for outside rewards.","7A-004"],
["ps","Self-determination theory?","Motivation thrives when needs for autonomy, competence, and relatedness are met.","7A-005"],
["ps","Hypothalamus and hunger?","Lateral hypothalamus triggers hunger. Ventromedial hypothalamus signals fullness.","7A-006"],
["ps","Ekman's universal emotions?","Happiness, sadness, fear, anger, surprise, disgust (contempt was added later).","6C-001"],
["ps","Primary vs. secondary appraisal?","Primary: is this a threat? Secondary: can I cope with it? (Lazarus).","6C-002"],
["ps","General adaptation syndrome?","Alarm, resistance, exhaustion (Selye).","6C-003"],
["ps","Problem-focused vs. emotion-focused coping?","Problem-focused: changing the situation. Emotion-focused: managing feelings about it.","6C-004"],
["ps","Freud's id, ego, superego?","Id: instinct and pleasure. Superego: morals. Ego: mediates between them and reality.","7A-007"],
["ps","Common defense mechanisms?","Repression, projection, reaction formation, displacement, sublimation, rationalization.","7A-008"],
["ps","Big Five personality traits?","Openness, conscientiousness, extraversion, agreeableness, neuroticism (OCEAN).","7A-009"],
["ps","Locus of control?","Internal: believing you control outcomes. External: believing outside forces do (Rotter).","7A-010"],
["ps","Self-efficacy?","Belief in your ability to succeed at a specific task (Bandura).","7A-011"],
["ps","Humanistic perspective?","Focuses on growth and self-actualization. Rogers emphasized unconditional positive regard.","7A-012"],
["ps","Biopsychosocial model?","Health and illness come from biological, psychological, and social factors together.","7A-013"],
["ps","Major depressive disorder criteria?","At least 5 symptoms for 2 weeks or more, including depressed mood or loss of interest.","7A-014"],
["ps","Bipolar I vs. bipolar II?","Bipolar I: at least one manic episode. Bipolar II: hypomania plus major depression, never full mania.","7A-015"],
["ps","Positive vs. negative symptoms of schizophrenia?","Positive (added): hallucinations, delusions, disorganized speech. Negative (missing): flat affect, avolition, alogia.","7A-016"],
["ps","Generalized anxiety disorder?","Excessive, hard-to-control worry most days for at least 6 months.","7A-017"],
["ps","Obsessions vs. compulsions?","Obsessions: intrusive thoughts. Compulsions: repetitive behaviors done to relieve them.","7A-018"],
["ps","PTSD?","After trauma: intrusive memories, avoidance, negative mood changes, and hyperarousal lasting more than a month.","7A-019"],
["ps","Personality disorder clusters?","A: odd or eccentric. B: dramatic or erratic. C: anxious or fearful.","7A-020"],
["ps","Serotonin and depression?","Serotonin participates in mood regulation, and SSRIs inhibit its reuptake. Depression is multifactorial and cannot be explained simply as low serotonin.","7A-021"],

function dstr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function today(){ return dstr(new Date()); }
function addDays(n){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return dstr(d); }
function niceDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }

const dayNum = s => { const [y,m,d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m-1, d) / 864e5); };
const daysUntil = s => dayNum(s) - dayNum(today());
function testCap(){ const t = progress.testDate; if(!t) return null; const left = daysUntil(t); return left > 0 ? Math.max(1, Math.floor(left / 2)) : null; }
