  Object.values(progress.cards).forEach(s => { if(s.due > limit){ s.due = limit; s.interval = Math.min(s.interval, cap); changed = true; } });
  return changed;
}
if(clampToTest()) save();

const BY_ID = {}; CARDS.forEach(c => BY_ID[c[3]] = c);
const REV = "~r";
const idOf = key => key.endsWith(REV) ? key.slice(0, -REV.length) : key;
const isRevKey = key => key.endsWith(REV);
const canReverse = id => !!REVERSE[id];
const st = key => progress.cards[key];
const isDue = key => { const s = st(key); return !!s && s.due <= today(); };
const seenCard = id => !!(st(id) || st(id + REV));
function secsFor(k){ return SECTIONS[k] ? [k] : Object.keys(SECTIONS); }
const catOf = id => id.split("-")[0];
function poolFor(k){
  if(k === "bm") return CARDS.filter(c => progress.bookmarks[c[3]]);
  if(k === "weak"){ const cats = weakCats(); return CARDS.filter(c => cats.includes(catOf(c[3]))); }
  const secs = secsFor(k); return CARDS.filter(c => secs.includes(c[0]));
}
// Weakness scores: each studied card counted once by its most recent rating (Knew It 100%, Struggled 50%, Didn't Know 0%).
const SCORE = { good:1, hard:0.5, again:0 };
function catStats(){
  const out = {}; Object.keys(CATEGORIES).forEach(g => out[g] = { total:0, n:0, sum:0 });
  CARDS.forEach(c => { const o = out[catOf(c[3])]; if(!o) return; o.total++; const r = lastRating(c[3]); if(r){ o.n++; o.sum += SCORE[r]; } });
  return out;
}
// The 3 lowest-scoring topics below 100%, preferring topics with at least 3 studied cards.
function weakest(){
  const cs = catStats();
  const below = Object.entries(cs).filter(([, o]) => o.n > 0 && o.sum < o.n);
  let list = below.filter(([, o]) => o.n >= 3);
  if(!list.length) list = below;
  return list.map(([cat, o]) => ({ cat, pct: o.sum / o.n, n: o.n })).sort((a, b) => a.pct - b.pct || b.n - a.n).slice(0, 3);
}
function weakCats(){ const o = progress.open.weak; return o && o.cats ? o.cats : weakest().map(w => w.cat); }
// Most recent rating of a card in either direction.
function lastRating(id){
  let best = null, bt = -1;
  [id, id + REV].forEach(k => { const s = st(k); const h = s && s.history[s.history.length-1]; if(h){ const t = h.t || Date.parse(h.d); if(t >= bt){ bt = t; best = h.r; } } });
  return best;
}

function rate(key, r, written){
  const t = today();
  let s = st(key);
  const isNew = !s;
  if(isNew){
    s = progress.cards[key] = { status:"learning", writing:false, last:null, due:t, interval:0, reps:0, total:0, good:0, bad:0, history:[] };
    if(progress.newDay.date !== t) progress.newDay = { date:t, count:0 };
    progress.newDay.count++;
  }
  const firstToday = s.last !== t;
  const early = !isNew && firstToday && s.due > t;   // reviewing before it was due
  // Daily-first ratings before this one, used to slow down cards with a history of misses.
  const daily = s.history.filter((h,i,a) => i === 0 || a[i-1].d !== h.d).slice(-RULES.missWindow);
  const misses = daily.filter(h => h.r !== "good").length;

  s.history.push(written ? { d:t, r, t:Date.now(), w:written } : { d:t, r, t:Date.now() });   // w = what she wrote after Struggled / Didn't know
  if(s.history.length > RULES.historyKeep) s.history = s.history.slice(-RULES.historyKeep);
  if(firstToday){ s.total++; if(r === "good") s.good++; else s.bad++; }

  if(r === "again"){
    s.reps = 0; s.interval = 0; s.due = t; s.writing = true; s.status = "learning";
  } else if(r === "hard"){
    s.reps = 0; s.interval = 1; s.due = addDays(1); s.writing = true; s.status = "learning";
  } else { // good
    s.writing = false;
    if(!firstToday || early){
      // Repeat on the same day, or an early review: never pushes the card further out.
      if(s.interval === 0){ s.interval = 1; s.due = addDays(1); }
    } else {
      s.reps++;
      const base = LADDER[Math.min(s.reps - 1, LADDER.length - 1)];
      const factor = misses === 0 ? 1 : misses === 1 ? 0.6 : 0.4;
      s.interval = Math.max(1, Math.round(base * factor));
      const cap = testCap(); if(cap !== null) s.interval = Math.min(s.interval, cap);
      s.due = addDays(s.interval);
      s.status = "review";
    }
  }
  s.last = t;
  return save();
}

/* ---------- Sessions ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nextQuote(){ if(!quotePool.length) quotePool = shuffle(QUOTES.slice()); return quotePool.pop(); }
const CUSTOM = { bm:"My Bookmarks", weak:"Weakest topics" };
function topicName(k){ return k==="all" ? "All topics" : CUSTOM[k] || SECTIONS[k].name; }

function openSession(k){
  const o = progress.open[k];
  if(!o || o.date !== today()) return null;            // a new day gets a fresh schedule
  const ok = key => !!BY_ID[idOf(key)];
  const ids = o.ids.filter(ok);
  const at = Math.min(o.ids.slice(0, o.pos).filter(ok).length, ids.length);
  return at < ids.length ? Object.assign({}, o, { ids, pos: at }) : null;
}

// Which directions a card can be studied in under the current display mode.
function keysFor(id, view){
  if(!canReverse(id) || view === "q") return [id];
  return view === "a" ? [id + REV] : [id, id + REV];
}
// Priority of one card direction for a new session (lower is sooner). 9 = leave out today.
function bucket(key){
  const s = st(key), t = today();
  if(!s) return 2;                                                  // new
  const last = s.history[s.history.length-1];
  if(s.last !== t) return s.due <= t ? 0 : 3;                       // due review, or early review
  if(last && last.r === "again" && s.retry !== t) return 1;         // missed today: one more look
  return 9;                                                         // already reviewed today
}
// Bookmark and weakest-topic sessions: the chosen cards regardless of due date. Ratings still follow the normal rules
// (and the early-review rule keeps them from pushing cards further out than they've earned).
function buildTargeted(k){
  const view = progress.view;
  const opts = poolFor(k).map(c => shuffle(keysFor(c[3], view).map(key => ({ key, b: bucket(key) }))).reduce((a, o) => o.b < a.b ? o : a));
  const rank = o => {
    if(k === "weak"){ const s = st(o.key), h = s && s.history[s.history.length-1]; return !h ? 3 : h.r === "again" ? 0 : h.r === "hard" ? 1 : 2; }
    return o.b === 9 ? 4 : o.b;
  };
  return shuffle(opts).sort((a, b) => rank(a) - rank(b)).slice(0, RULES.sessionSize).map(o => o.key);
}
function buildQueue(k){
  if(CUSTOM[k]) return buildTargeted(k);
  const view = progress.view, n = RULES.sessionSize;
  const picks = [[],[],[],[]], later = [];
  poolFor(k).forEach(c => {
    const opts = shuffle(keysFor(c[3], view).map(key => ({ key, b: bucket(key) })));
    const best = opts.reduce((a, o) => o.b < a.b ? o : a);
    if(best.b < 4) picks[best.b].push(best.key); else later.push(best.key);
  });
  const soonest = (a,b) => st(a).due.localeCompare(st(b).due);
  picks[0] = shuffle(picks[0]).sort(soonest);
  picks[1] = shuffle(picks[1]);
  picks[2] = shuffle(picks[2]);
  picks[3] = shuffle(picks[3]).sort(soonest);
  let chosen = picks[0].concat(picks[1], picks[2], picks[3]).slice(0, n);
  // Everything here was already studied today: let her keep going (these don't change long-term schedules).
  if(!chosen.length) chosen = shuffle(later).slice(0, n);
  const t = today();
  chosen.forEach(key => { if(bucket(key) === 1) st(key).retry = t; });
  const head = chosen.filter(key => bucket(key) === 0 || (st(key) && st(key).retry === t && st(key).last === t));
  const rest = shuffle(chosen.filter(key => !head.includes(key)));
  return head.concat(rest);
}

function pick(k){ filter = k; quote = nextQuote(); show("intro"); }

function start(fresh){
  let o = fresh ? null : openSession(filter);
  if(!o){
    const cats = filter === "weak" ? weakest().map(w => w.cat) : null;
    if(cats) progress.open.weak = { cats };   // so the pool is stable while the queue is built
    o = progress.open[filter] = { date:today(), ids:buildQueue(filter), pos:0, view:progress.view, elapsed:0, repeats:{}, results:{} };
    if(cats) o.cats = cats;
    save();
  }

  undo = [];
  resetCard(); sessionStart = Date.now();
  show(total ? "cards" : "done");
}

function persistPlace(){
  const o = progress.open[filter]; if(!o) return;
  o.ids = deck.slice(); o.pos = pos;
  o.elapsed = (o.elapsed || 0) + (Date.now() - sessionStart); sessionStart = Date.now();

function minutesIn(){ const o = progress.open[filter]; return Math.floor((((o && o.elapsed) || 0) + (Date.now() - sessionStart)) / 60000); }

// The direction shown for the current card. A display-mode change made mid-session applies from the next card.
function resolveKey(key){
  const id = idOf(key), o = progress.open[filter], view = progress.view;
  if(!canReverse(id)) return id;
  if(o && o.view === view) return key;
  if(view === "q") return id;
  if(view === "a") return id + REV;
  return Math.random() < 0.5 ? id : id + REV;
}
function resetCard(){ flipped = false; revealed = false; draft = ""; shownKey = null; explainOpen = null; notesFor = null; pendingR = null; reinforceDraft = ""; reportOpen = false; reportFlashFor = null; curKey = deck[pos] ? resolveKey(deck[pos]) : null; }

/* ---------- Sessions and study time ---------- */
// A session counts once, when she reveals her first answer in it.
// Time counts only while she's on a card screen, the tab is visible, and she has done something in the last 2 minutes.
const IDLE_MS = 120000;
let lastActive = Date.now(), lastTick = Date.now(), unsavedMs = 0;
function fmtTime(ms){ const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)}h ${m % 60}m`; }
function markActive(){ lastActive = Date.now(); }
function tickTime(){
  const now = Date.now(), step = Math.min(now - lastTick, 5000);
  lastTick = now;
  if(mode === "cards" && !document.hidden && now - lastActive < IDLE_MS && step > 0){
    progress.stats.ms += step; unsavedMs += step;
    if(unsavedMs >= 15000){ unsavedMs = 0; save(); }
  }
}
function flushTime(){ tickTime(); if(unsavedMs){ unsavedMs = 0; save(); } }
["click","keydown","input","touchstart","scroll"].forEach(t => document.addEventListener(t, markActive, { passive:true }));
document.addEventListener("visibilitychange", () => { if(document.hidden) flushTime(); else { lastTick = Date.now(); markActive(); } });
setInterval(tickTime, 1000);

const toPlain = h => String(h).replace(/<sup>(.*?)<\/sup>/g, "^$1").replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&amp;/g, "&");
async function sendReport(){

    _subject: `Flashcard report: ${id}`,

}

      ${weak.length ? `<p class="lede" style="margin:0">Your weakest topics right now: <b>${weak.map(w => `${w.cat} ${CATEGORIES[w.cat]}`).join(", ")}</b>.</p>` : `<p class="lede" style="margin:0">${Object.values(cs).some(o => o.n) ? "No weak spots yet: every topic you've studied is at 100%." : "Study a few sessions first, and your weakest topics will show up here."}</p>`}
      <div class="controls"><button class="btn" id="sideBack" type="button">Back</button>
      <button class="btn primary" id="weakStudy" type="button" ${weak.length ? "" : "disabled"}>Study My Weakest Topics</button></div>
      ${Object.keys(SECTIONS).map(sec => {
        const cats = secCats(sec), n = cats.reduce((a, g) => a + cs[g].n, 0), sum = cats.reduce((a, g) => a + cs[g].sum, 0);
        return `<div class="wk-sec"><div class="wk-head"><span class="t-name">${SECTIONS[sec].name}</span><span class="wk-val">${n ? `${pct(sum, n)}% · ${n} reviewed` : "Not Studied Yet"}</span></div>
          <ul class="list">${cats.map(g => { const o = cs[g]; return `<li class="wk-row${weakSet.has(g) ? " is-weak" : ""}">
            <span class="wk-name">${g} ${CATEGORIES[g]}</span>
            <span class="wk-val">${o.n ? `${pct(o.sum, o.n)}% · ${o.n} reviewed` : "Not Studied Yet"}</span>
            ${o.n ? `<span class="wk-bar" aria-hidden="true"><span style="width:${pct(o.sum, o.n)}%"></span></span>` : ""}</li>`; }).join("")}</ul></div>`;
      }).join("")}`;
    $("sideBack").onclick = goBack;
    if(weak.length) $("weakStudy").onclick = () => pick("weak");
    $("sideBack").focus();
    return;
  }
  if(mode === "import"){
    const when = pendingImport.exported ? new Date(pendingImport.exported).toLocaleString() : "an unknown date";
    scr.innerHTML = `<p class="big">Replace your progress?</p>
      <p class="lede" style="margin:0">The backup from ${esc(when)} has <b>${studiedCount(pendingImport.progress)}</b> cards studied. Your current progress (<b>${studiedCount(progress)}</b> cards studied) will be replaced. This can't be undone.</p>
      <div class="controls"><button class="btn" id="cancelImport" type="button">Cancel</button>
      <button class="btn primary" id="doImport" type="button">Replace progress</button></div>`;
    $("cancelImport").onclick = () => { pendingImport = null; show("welcome"); };
    $("doImport").onclick = applyImport;
    $("cancelImport").focus();
    return;
  }
  if(mode === "intro"){
    const resume = openSession(filter);
    const cats = filter === "weak" ? weakCats() : null;
    const note = [resume ? `Picking up where you left off: card ${resume.pos + 1} of ${resume.ids.length}.` : "",
      cats ? `Topics: ${cats.map(g => `${g} ${CATEGORIES[g]}`).join(", ")}.` : ""].filter(Boolean).join(" ");
    // Intro line above the quote: scientists and doctors vs. Dungeon Crawler Carl characters.
    const fromDungeon = ["Carl", "Princess Donut", "Mordecai", "Prepotente"].includes(quote[1].split(",")[0]);
    // Physicians (MDs) get the "sat where you're sitting" line; other scientists get the "quoting you someday" line.
    const fromDoctor = ["William Osler", "Elizabeth Blackwell", "Santiago Ramón y Cajal", "Hippocrates", "Albert Szent-Györgyi"].includes(quote[1]);
    const intro = fromDungeon ? "Before you start: a word from the dungeon."
      : fromDoctor ? "Before you start: a word from someone who sat right where you're sitting. Not better than you, just earlier."
      : "A quote from someone who, someday will be quoting you...if they are still alive.";
    scr.innerHTML = `<p class="q-intro">${intro}</p>
      <div><div class="q-text">“${quote[0]}”</div><div class="q-by">${quote[1]}</div></div>
      ${note ? `<p class="lede" style="margin:0">${note}</p>` : ""}
      <div class="controls"><button class="btn" id="back" type="button">Back</button>
      <button class="btn primary" id="toQuote" type="button">Continue</button></div>`;
    $("back").onclick = () => show("welcome");
    $("toQuote").onclick = () => start(); $("toQuote").focus();
    return;
  }
  if(mode === "done"){
    const upcoming = poolFor(filter).flatMap(c => [st(c[3]), st(c[3] + REV)]).filter(Boolean).map(x => x.due).filter(d => d > today()).sort()[0];
    const rs = Object.values(lastResults), n = rs.length, knew = rs.filter(x => x === "good").length;
    const missRate = n ? (n - knew) / n : 0, knewRate = n ? knew / n : 0;
    const endQ = n < RESULT.minCards ? null
      : missRate > RESULT.roughAbove ? ROUGH_QUOTE
      : knewRate >= RESULT.goodAt ? GOOD_QUOTES[Math.floor(Math.random() * GOOD_QUOTES.length)] : null;
    scr.innerHTML = `<p class="big">Session complete.</p>
      ${n ? `<p class="lede" style="margin:0">You knew ${knew} of ${n} cards (${Math.round(knewRate*100)}%).</p>` : ""}
      ${endQ ? `<div><span class="lab" style="margin-bottom:8px">Words from the wise:</span><div class="q-text">“${endQ[0]}”</div><div class="q-by">${endQ[1]}</div></div>` : ""}
      <p class="lede" style="margin:0">${upcoming ? `Next review in ${topicName(filter)}: ${niceDate(upcoming)}.` : ""}</p>
      <div class="controls"><button class="btn" id="other" type="button">Pick another topic</button>
      <button class="btn primary" id="more" type="button">Next ${Math.min(RULES.sessionSize, poolFor(filter).length)} cards</button></div>
      ${undo.length ? `<div class="backup"><button class="link" id="prevDone" type="button">Previous Card</button></div>` : ""}`;
    if(undo.length) $("prevDone").onclick = previousCard;
    $("other").onclick = () => show("welcome");
    $("more").onclick = () => start(true);
    $("more").focus();
    return;
  }

  // ----- card -----
  $("topicname").textContent = topicName(filter);
  $("bar").style.width = total ? (pos/total*100)+"%" : "0";
  const id = idOf(curKey), [sec, q, a] = BY_ID[id], rev = isRevKey(curKey);
  const rv = rev ? REVERSE[id] : null;
  const front = rev ? (rv[0] || `<span class="lab">Which term or concept is described by:</span>${a}`) : q;
  const asked = rev ? (rv[0] || a) : q, back = rev ? rv[1] : a;
  document.querySelectorAll("#view [data-v]").forEach(b => { const on = b.dataset.v === progress.view; b.setAttribute("aria-checked", String(on)); b.tabIndex = on ? 0 : -1; });
  const needWrite = !!(st(curKey) && st(curKey).writing);
  if(shownKey !== curKey){ shownKey = curKey; $("answer").value = draft; }
  const yours = needWrite && draft.trim() ? `<div class="yours"><span class="lab">Your answer</span><div>${esc(draft).replace(/\n/g,"<br>")}</div></div>` : "";
  const marked = !!progress.bookmarks[id];
  $("card").innerHTML = `<div class="meta"><span>${id} · ${CATEGORIES[id.split("-")[0]]}</span><span class="meta-r"><button class="bm" type="button" aria-pressed="${marked}" aria-label="${marked ? "Remove bookmark" : "Bookmark this card"}">${marked ? "★ Bookmarked" : "☆ Bookmark"}</button><span class="side">${flipped ? "Answer" : "Question"}</span></span></div>
    <div class="face">${flipped
      ? `<div class="asked">${asked}</div>${yours}<div class="ans">${yours ? `<span class="lab">Correct answer</span>` : ""}${back}</div>`
      : `<div>${front}</div>`}</div>`;
  $("write").hidden = !(needWrite && !revealed);
  $("revealRow").hidden = revealed;
  $("rateRow").hidden = !revealed;
  document.querySelectorAll("#rateRow [data-r]").forEach(b => b.setAttribute("aria-pressed", String(pendingR === b.dataset.r)));
  $("reinforce").hidden = !(revealed && pendingR);
  if(revealed && pendingR && $("reinforceText").value !== reinforceDraft) $("reinforceText").value = reinforceDraft;
  const nChars = reinforceDraft.trim().length;
  $("reinforceNext").disabled = nChars < MIN_REINFORCE;
  $("reinforceHint").textContent = nChars < MIN_REINFORCE ? `${nChars} / ${MIN_REINFORCE} characters` : "";
  const sess = progress.open[filter];
  $("skipToggle").setAttribute("aria-pressed", String(!!(sess && sess.skip)));
  $("reportBox").hidden = !reportOpen;
  $("reportBtn").setAttribute("aria-expanded", String(reportOpen));
  $("reportSend").disabled = reportBusy;
  $("reportSend").textContent = reportBusy ? "Sending…" : "Send";
  $("reportFlash").textContent = reportFlashFor === curKey ? "Thanks, flagged" : "";
  $("reveal").disabled = needWrite && !draft.trim();
  $("prev").disabled = !undo.length;
  // My Notes: only after the answer is revealed. Opens on its own if she has notes on this card.
  const myNote = progress.notes[id] || "";
  if(revealed && explainOpen === null) explainOpen = !!myNote;
  $("explainWrap").hidden = !revealed;
  $("explainPanel").hidden = !(revealed && explainOpen);
  $("explainBtn").setAttribute("aria-expanded", String(!!(revealed && explainOpen)));
  $("explainBtn").textContent = explainOpen ? "Hide Card Note" : "Write Card Note";
  if(notesFor !== id){ notesFor = id; $("notes").value = myNote; $("notesStatus").textContent = ""; }
  $("delNote").hidden = !myNote;
  const mins = minutesIn();
  $("hint").textContent = mins >= RULES.softMinutes
    ? `${mins} minutes in. This is a good place to stop${lastSaveOk ? "; your progress is saved" : ""}.`
    : revealed ? (pendingR ? "" : "Compare with the answer, then rate yourself. Keys: 1, 2, 3.") : needWrite ? "" : "Tap the card, press Space, or use Reveal Answer.";
}

/* ---------- Card actions ---------- */
let flipping = false;
const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateFlip(change, after){
  const card = $("card");
  const done = () => { if(after) after(); };
  if(calm || !card.animate){ change(); render(); done(); return; }
  flipping = true;
  const P = "perspective(1400px) ";
  const out = card.animate([{transform:P+"rotateY(0deg)"},{transform:P+"rotateY(90deg)"}],{duration:170,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"});
  out.onfinish = () => {
    change(); render();
    const back = card.animate([{transform:P+"rotateY(-90deg)"},{transform:P+"rotateY(0deg)"}],{duration:190,easing:"cubic-bezier(0,0,.2,1)"});
    out.cancel();
    back.onfinish = back.oncancel = () => { flipping = false; done(); };
  };
}
function focusCard(){
  const k = curKey; if(!k) return;
  if(st(k) && st(k).writing && !revealed) $("answer").focus(); else $("card").focus();
}
function reveal(){
  if(mode!=="cards" || flipping || revealed) return;
  if(st(curKey) && st(curKey).writing && !draft.trim()) { $("answer").focus(); return; }
  const o = progress.open[filter];
  if(o && !o.counted){ o.counted = true; progress.stats.sessions++; save(); }
  animateFlip(() => { revealed = true; flipped = true; }, () => $("card").focus());
}
// Go back to the card she just rated, undo that rating completely, and show it answered so she can rate it again.
function previousCard(){
  if(flipping || !undo.length) return;
  const u = undo.pop();
  if(u.card) progress.cards[u.key] = u.card; else delete progress.cards[u.key];
  progress.newDay = u.newDay;
  progress.open[filter] = u.open;
  deck = u.open.ids.slice(); total = deck.length; pos = u.open.pos;
  curKey = u.key; shownKey = null; draft = u.draft || ""; revealed = true; flipped = true; explainOpen = null; notesFor = null; pendingR = null; reinforceDraft = ""; reportOpen = false; reportFlashFor = null;
  sessionStart = Date.now();
  save();
  show("cards"); $("card").focus();
}
function tapCard(){
  if(mode!=="cards" || flipping) return;
  if(!revealed) reveal(); else animateFlip(() => { flipped = !flipped; });
}
function flushNote(){
  if(notesTimer && notesFor){ clearTimeout(notesTimer); notesTimer = null; const t = $("notes").value; if(t.trim()) progress.notes[notesFor] = t; else delete progress.notes[notesFor]; save(); }
}
// Got it moves on. Struggled / Didn't know open the writing box first, unless "Skip reinforcement input" is on.
function chooseRating(r){
  if(mode!=="cards" || flipping || !revealed) return;
  const o = progress.open[filter];
  if(r === "good" || (o && o.skip)){ answer(r); return; }
  if(pendingR !== r){ pendingR = r; }
  render(); $("reinforceText").focus();
}
function submitReinforce(){
  if(!pendingR || reinforceDraft.trim().length < MIN_REINFORCE) return;
  answer(pendingR, reinforceDraft.trim());
}
function answer(r, written){
  if(mode!=="cards" || flipping || !revealed) return;
  flushNote();
  const key = curKey, o = progress.open[filter];
  const copy = x => x ? JSON.parse(JSON.stringify(x)) : null;
  if(o) undo.push({ key, card: copy(st(key)), newDay: copy(progress.newDay), open: copy(o), draft });
  if(o){
    o.results = o.results || {}; if(!(key in o.results)) o.results[key] = r;
    o.repeats = o.repeats || {};
  }
  rate(key, r, written);
  if(r === "again" && o && (o.repeats[key] || 0) < RULES.maxRepeats){
    o.repeats[key] = (o.repeats[key] || 0) + 1;
    const at = Math.min(deck.length, pos + 1 + RULES.requeueGap);
    deck.splice(at, 0, key); total = deck.length;
  }
  pos++; resetCard(); persistPlace();
  if(pos >= deck.length) show("done"); else { render(); focusCard(); }
}

$("card").onclick = e => {
  if(e && e.target && e.target.closest && e.target.closest(".bm")){ if(curKey) toggleBookmark(idOf(curKey)); return; }
  tapCard();
};
$("card").onkeydown = e => { if(e.target !== $("card")) return; if(e.key==="Enter"){ e.preventDefault(); tapCard(); } };
$("bmNav").onclick = () => openSide("bm");
function applyBg(){
  const dark = progress.bg === "dark";
  document.documentElement.setAttribute("data-bg", dark ? "dark" : "light");
  $("modeBtn").setAttribute("aria-pressed", String(dark));
  $("modeBtn").textContent = dark ? "☀" : "☾";
  const label = dark ? "White background" : "Dark background";
  $("modeBtn").setAttribute("aria-label", label); $("modeBtn").title = label;
}
$("modeBtn").onclick = () => { progress.bg = progress.bg === "dark" ? "light" : "dark"; save(); applyBg(); };
applyBg();
$("notesNav").onclick = () => openSide("notes");
$("reveal").onclick = reveal;
$("prev").onclick = previousCard;
$("explainBtn").onclick = () => { explainOpen = !explainOpen; render(); if(explainOpen) $("notes").focus(); };
$("delNote").onclick = () => {
  clearTimeout(notesTimer); notesTimer = null;
  delete progress.notes[notesFor]; $("notes").value = "";
  $("notesStatus").textContent = save() ? "Note deleted." : "";
  $("delNote").hidden = true;
};
$("notes").oninput = e => {
  const id = notesFor, text = e.target.value;
  clearTimeout(notesTimer);
  notesTimer = setTimeout(() => {
    if(text.trim()) progress.notes[id] = text; else delete progress.notes[id];
    $("notesStatus").textContent = save() ? (text.trim() ? "Note saved." : "Note deleted.") : "";
    $("delNote").hidden = !text.trim();
  }, 400);
};
$("answer").oninput = e => { draft = e.target.value; $("reveal").disabled = !draft.trim(); };
document.querySelectorAll("#rateRow [data-r]").forEach(b => b.onclick = () => chooseRating(b.dataset.r));
$("reinforceText").oninput = e => { reinforceDraft = e.target.value; const n = reinforceDraft.trim().length; $("reinforceNext").disabled = n < MIN_REINFORCE; $("reinforceHint").textContent = n < MIN_REINFORCE ? `${n} / ${MIN_REINFORCE} characters` : ""; };
$("reinforceNext").onclick = submitReinforce;
$("skipToggle").onclick = () => { const o = progress.open[filter]; if(!o) return; o.skip = !o.skip; save(); render(); };
$("reportBtn").onclick = () => { reportOpen = !reportOpen; $("reportMsg").textContent = ""; render(); if(reportOpen) $("reportNote").focus(); };
$("reportCancel").onclick = () => { reportOpen = false; $("reportNote").value = ""; $("reportMsg").textContent = ""; render(); $("card").focus(); };
$("reportSend").onclick = sendReport;
const viewBtns = Array.from(document.querySelectorAll("#view [data-v]"));
function setView(v){ progress.view = v; save(); render(); }   // takes effect on the next card
viewBtns.forEach((b, i) => {
  b.onclick = () => setView(b.dataset.v);
  b.onkeydown = e => {
    const step = { ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1 }[e.key];
    if(!step) return;
    e.preventDefault();
    const nb = viewBtns[(i + step + viewBtns.length) % viewBtns.length];
    setView(nb.dataset.v); nb.focus();
  };
});
$("change").onclick = () => { flushTime(); flushNote(); persistPlace(); undo = []; show("welcome"); };
$("importFile").onchange = e => { const f = e.target.files && e.target.files[0]; if(f) readImport(f); };
document.addEventListener("keydown", e => {
  if(mode!=="cards" || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.target.closest && e.target.closest("button, textarea, input")) return;
  if(e.key===" "){ e.preventDefault(); tapCard(); }
  else if(revealed && ["1","2","3"].includes(e.key)){ e.preventDefault(); chooseRating({ "1":"good", "2":"hard", "3":"again" }[e.key]); }
});
window.addEventListener("pagehide", () => { flushTime(); flushNote(); if(mode==="cards") persistPlace(); });

render();
</script>

</body>
