name: Card protection
# Fails if any original flashcard's text, ID or appearance changed without an authorized correction,
# or if the card metadata is incomplete or inconsistent. See docs/package-1/CARD-CORRECTIONS.md.
on:
  push:
  pull_request:
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Original cards unchanged
        run: node tools/check-cards.js
      - name: Card metadata valid
        run: node tools/validate-metadata.js
      - name: Graphical cards valid (new IDs, text alternatives, approval before publishing)
        run: node tools/validate-graphics.js
      - name: Install visual-check tools
        working-directory: tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Card interface looks the same
        working-directory: tools
        run: node visual-check.js

      - name: Website navigation, demo, responsive layout and auth entry routes
        run: node tests/website-browser.test.js
        env:
          NODE_PATH: ./tools/node_modules
      - name: Contact validation and delivery responses
        run: node tests/contact.test.js

      - name: Screen URLs, refresh, history and protected routes
        run: node tests/screen-routing-browser.test.js
        env:
          NODE_PATH: ./tools/node_modules
